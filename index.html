<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Midterm Masterclass</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; color: #1e293b; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Animation specific styles */
        .process-box { transition: all 0.5s ease-in-out; }
        .zombie-state { filter: grayscale(100%); opacity: 0.6; border: 2px dashed #94a3b8; }
        .exec-state { background: linear-gradient(135deg, #6d28d9, #8b5cf6); border-color: #a78bfa; }

        /* Halo พื้นหลังให้ข้อความในแผนภาพไม่ทับเส้นลูกศร */
        main svg text {
            paint-order: stroke;
            stroke: #f1f5f9;
            stroke-width: 4px;
            stroke-linejoin: round;
        }

        /* Print / PDF */
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .print-only { display: none; }
        @page { size: A4; margin: 12mm; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: #ffffff !important; }
            main { padding: 0 !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper Component: Syntax Highlighted Code Block ---
        const CodeBlock = ({ code, language = "c" }) => {
            const highlight = (text) => {
                let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const tokens = [];
                const tok = (re, cls) => {
                    html = html.replace(re, (...m) => {
                        const idx = tokens.length;
                        const ph = '\u0000' + String.fromCharCode(65 + (idx % 26)) + String.fromCharCode(65 + Math.floor(idx / 26)) + '\u0000';
                        tokens.push(`<span class="${cls}">${m[1]}</span>`);
                        return ph;
                    });
                };
                tok(/\b(int|pid_t|if|else|return|void|char|NULL)\b/g, 'text-pink-400 font-bold');
                tok(/\b(fork|wait|waitpid|exit|execlp|printf)\b/g, 'text-blue-600');
                tok(/("[^"]*")/g, 'text-amber-600');
                tok(/(\/\/.*)/g, 'text-emerald-500/70 italic');
                tok(/\b(\d+)\b/g, 'text-purple-600');
                tokens.forEach((t, i) => {
                    const ph = '\u0000' + String.fromCharCode(65 + (i % 26)) + String.fromCharCode(65 + Math.floor(i / 26)) + '\u0000';
                    html = html.replace(ph, t);
                });
                return { __html: html };
            };

            return (
                <div className="relative group rounded-xl overflow-hidden shadow-lg border border-slate-300 mt-4 mb-6">
                    <div className="bg-slate-50 px-4 py-2 border-b border-slate-300 flex justify-between items-center text-xs text-slate-600 font-mono">
                        <span>Code ({language})</span>
                        <div className="flex gap-2"><div className="w-3 h-3 rounded-full bg-red-500"></div><div className="w-3 h-3 rounded-full bg-yellow-500"></div><div className="w-3 h-3 rounded-full bg-green-500"></div></div>
                    </div>
                    <pre className="bg-slate-50 p-4 overflow-x-auto text-sm font-mono leading-relaxed"><code dangerouslySetInnerHTML={highlight(code)} /></pre>
                </div>
            );
        };

        // --- SVG Diagram Helpers ---
        const Diagram = ({ title, w = 680, h = 220, children }) => (
            <div className="mt-5 bg-white rounded-xl border border-slate-300 p-4">
                <div className="text-xs font-bold text-slate-600 uppercase tracking-wide mb-2"><i className="fa-solid fa-diagram-project mr-2"></i>{title}</div>
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto select-none">{children}</svg>
            </div>
        );

        const DBox = ({ x, y, w = 150, h = 60, title, sub, fill = '#ffffff', stroke = '#3b82f6', text = '#1e293b', titleSize = 13 }) => {
            const cx = x + w / 2;
            const subs = sub ? (Array.isArray(sub) ? sub : [sub]) : [];
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx={8} fill={fill} stroke={stroke} strokeWidth={1.5} />
                    <text x={cx} y={y + h / 2 - (subs.length ? subs.length * 7 : -5)} textAnchor="middle" fill={text} fontSize={titleSize} fontWeight="bold">{title}</text>
                    {subs.map((s, i) => (
                        <text key={i} x={cx} y={y + h / 2 + 6 + i * 14} textAnchor="middle" fill="#64748b" fontSize="10.5">{s}</text>
                    ))}
                </g>
            );
        };

        const DCode = ({ x, y, w = 260, h = 95, title, code, stroke = '#3b82f6', titleColor = '#2563eb' }) => {
            const lines = code.split('\n');
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx={8} fill="#ffffff" stroke={stroke} strokeWidth={1.5} />
                    <text x={x + 12} y={y + 18} fontSize="11" fontWeight="bold" fill={titleColor}>{title}</text>
                    <line x1={x} y1={y + 26} x2={x + w} y2={y + 26} stroke="#334155" strokeWidth={1} />
                    {lines.map((l, i) => (
                        <text key={i} x={x + 12} y={y + 42 + i * 15} fontSize="10.5" fontFamily="monospace" fill="#1e293b">{l}</text>
                    ))}
                </g>
            );
        };

        const DArrow = ({ x1, y1, x2, y2, label, dashed = false, color = '#64748b', labelColor = '#475569', lx = 0, ly = 0 }) => {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len === 0) return null;
            const ux = dx / len, uy = dy / len;
            const ax = x2 - 9 * ux + 4 * uy, ay = y2 - 9 * uy - 4 * ux;
            const bx = x2 - 9 * ux - 4 * uy, by = y2 - 9 * uy + 4 * ux;
            const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            return (
                <g>
                    <line x1={x1} y1={y1} x2={x2 - 5 * ux} y2={y2 - 5 * uy} stroke={color} strokeWidth={1.5} strokeDasharray={dashed ? '5,4' : undefined} />
                    <polygon points={`${x2},${y2} ${ax},${ay} ${bx},${by}`} fill={color} />
                    {label && <text x={mx - 10 * uy + lx} y={my + 10 * ux + ly - 4} textAnchor="middle" fill={labelColor} fontSize="10">{label}</text>}
                </g>
            );
        };

        const Gantt = ({ segments, ticks, unit = 'ms' }) => {
            const SCALE = 20, X0 = 90, Y = 16, H = 44;
            const maxT = Math.max(...ticks.map(t => t.t));
            return (
                <svg viewBox={`0 0 ${X0 + maxT * SCALE + 40} 92`} className="w-full h-auto select-none">
                    {segments.map((s, i) => (
                        <g key={i}>
                            <rect x={X0 + s.start * SCALE} y={Y} width={(s.end - s.start) * SCALE} height={H} fill={s.color} opacity="0.25" stroke={s.color} strokeWidth={1.5} />
                            <text x={X0 + ((s.start + s.end) / 2) * SCALE} y={Y + H / 2 + 4} textAnchor="middle" fill="#1e293b" fontSize="11" fontWeight="bold">{s.label}</text>
                        </g>
                    ))}
                    {ticks.map((tk, i) => (
                        <g key={i}>
                            <line x1={X0 + tk.t * SCALE} y1={Y + H} x2={X0 + tk.t * SCALE} y2={Y + H + 6} stroke="#64748b" strokeWidth={1} />
                            <text x={X0 + tk.t * SCALE} y={Y + H + 18} textAnchor="middle" fill="#64748b" fontSize="10">{tk.label}</text>
                        </g>
                    ))}
                    <text x={12} y={Y + H / 2 + 4} fill="#64748b" fontSize="10">เวลา</text>
                </svg>
            );
        };

        // --- Glossary: ศัพท์เฉพาะอธิบายแบบง่ายสุด ---
        const Glossary = ({ title = "ศัพท์ต้องรู้ในหน้านี้ (ฉบับคนไม่เคยเรียน)", words }) => (
            <div className="bg-slate-100 p-5 rounded-xl border border-cyan-300 mt-6">
                <h3 className="text-xl font-bold text-cyan-700 mb-4"><i className="fa-solid fa-book-open-reader mr-2"></i>{title}</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                    {words.map((w, i) => (
                        <div key={i} className="bg-white p-3 rounded-lg border border-slate-300">
                            <span className="text-cyan-700 font-bold">{w}</span>
                            <span className="text-slate-600"> — </span>
                            <span className="text-slate-700">{TERMS[w]}</span>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- Inline Term Tooltip (i) ---
        let termPopupState = null;
        const termPopupListeners = [];
        const showTermPopup = (word, def, x, y) => { termPopupState = { word, def, x, y }; termPopupListeners.forEach(f => f(termPopupState)); };
        const hideTermPopup = () => { termPopupState = null; termPopupListeners.forEach(f => f(null)); };

        const Term = ({ word, def, children }) => (
            <span
                className="cursor-help border-b border-dotted border-cyan-500/80 text-cyan-700"
                onClick={(e) => { e.stopPropagation(); showTermPopup(word, def || TERMS[word], e.clientX, e.clientY); }}
            >
                {children || word}
                <i className="fa-solid fa-circle-info text-[10px] ml-0.5 text-cyan-600/90"></i>
            </span>
        );

        const TermPopover = () => {
            const [pop, setPop] = useState(null);
            useEffect(() => {
                const f = (p) => setPop(p);
                termPopupListeners.push(f);
                return () => { const i = termPopupListeners.indexOf(f); if (i >= 0) termPopupListeners.splice(i, 1); };
            }, []);
            useEffect(() => {
                if (!pop) return;
                const close = () => hideTermPopup();
                window.addEventListener('click', close);
                window.addEventListener('scroll', close, true);
                return () => { window.removeEventListener('click', close); window.removeEventListener('scroll', close, true); };
            }, [pop]);
            if (!pop) return null;
            const w = 300;
            const x = Math.min(Math.max(pop.x + 14, 8), window.innerWidth - w - 8);
            const y = Math.min(pop.y + 12, window.innerHeight - 140);
            return (
                <div className="no-print fixed z-50 rounded-lg border border-cyan-500/50 bg-white shadow-2xl p-4 backdrop-blur" style={{ left: x, top: y, width: w }}>
                    <div className="text-cyan-700 font-bold text-sm mb-1.5 flex items-center"><i className="fa-solid fa-circle-info mr-2"></i>{pop.word}</div>
                    <p className="text-slate-700 text-xs leading-relaxed">{pop.def}</p>
                    <p className="text-slate-600 text-[10px] mt-2">คลิกที่ใดก็ได้เพื่อปิด</p>
                </div>
            );
        };

        // --- Unified Term Dictionary (source เดียวสำหรับ popup + glossary) ---
        const TERMS = {
            "OS": "โปรแกรมใหญ่ที่คอยดูแลเครื่องทั้งเครื่อง ทำหน้าที่แบ่ง CPU และหน่วยความจำให้ทุกโปรแกรมใช้ร่วมกันอย่างเป็นธรรม",
            "Kernel Mode": "โหมดของระบบ มีสิทธิทำได้ทุกอย่าง (Mode bit = 0)",
            "Privileged Instructions": "คำสั่งอันตรายที่เฉพาะระบบเท่านั้นใช้ได้ เช่น สั่งการฮาร์ดแวร์โดยตรง",
            "User Mode": "โหมดของโปรแกรมทั่วไป ถูกจำกัดสิทธิ ต้องขอให้ OS ทำแทน (Mode bit = 1)",
            "Interrupt": "สัญญาณจากฮาร์ดแวร์ให้ CPU หยุดงานที่ทำอยู่ก่อน แล้วหันไปจัดการเรื่องใหม่",
            "ISR": "โปรแกรมสั้น ๆ ที่เตรียมไว้รับมือสัญญาณ interrupt แต่ละชนิด เหมือนพนักงานเฉพาะทางรอรับสาย",
            "Hardware Interrupt": "สัญญาณขัดจังหวะที่มาจากอุปกรณ์ภายนอก เช่น คีย์บอร์ด ดิสก์",
            "Trap": "การที่โปรแกรมจงใจเรียกให้ CPU เข้าโหมด Kernel เพื่อขอใช้บริการ OS",
            "Interrupt Vector Table": "ตารางที่เก็บที่อยู่ของโปรแกรมจัดการ interrupt แต่ละเบอร์ไว้",
            "Bootstrap Program": "โปรแกรมแรกที่ถูกเรียกตอนเปิดเครื่อง ฝังอยู่ใน ROM หน้าที่คือตามหา OS",
            "Firmware": "โปรแกรมที่ฝังติดเครื่องมาตั้งแต่โรงงาน อยู่ในชิป ROM ไม่หายแม้ปิดเครื่อง",
            "POST": "ขั้นตอนที่เครื่องตรวจสุขภาพฮาร์ดแวร์ตัวเองตอนเปิดเครื่อง",
            "Bootstrap Loader": "โปรแกรมที่อ่าน Boot Sector เพื่อโหลด OS ขึ้นมา",
            "Boot Sector": "พื้นที่เล็ก ๆ บนดิสก์ที่เก็บตัวโหลด OS เหมือนป้ายบอกทาง",
            "PID": "เลขบัตรประชาชนของแต่ละ Process ที่กำลังรัน",
            "BIOS": "ระบบเฟิร์มแวร์รุ่นเก่า ทำงานแบบ text มีข้อจำกัดหลายอย่าง",
            "UEFI": "ระบบเฟิร์มแวร์รุ่นใหม่ ใช้เมาส์ได้ บูตไว มี Secure Boot",
            "Secure Boot": "ระบบตรวจลายเซ็นของ OS ก่อนยอมบูต เพื่อกันมัลแวร์",
            "Virtual Machine": "เครื่องคอมพิวเตอร์จำลองที่สร้างด้วยซอฟต์แวร์ ใช้ได้เหมือนเครื่องจริง",
            "Hypervisor": "ผู้จัดการที่แบ่งฮาร์ดแวร์จริงให้เครื่องเสมือนหลายเครื่องใช้งานร่วมกัน",
            "Host OS": "OS จริงของเครื่อง (ตรงข้ามกับ Guest OS ที่อยู่ข้างใน VM)",
            "Namespace": "เทคนิคกั้นมุมมองให้แต่ละ Container เห็นเฉพาะของตัวเอง ไม่เห็นของคนอื่น",
            "Image": "แม่แบบสำเร็จรูปสำหรับสร้าง Container เปรียบเสมือนพิมพ์เขียวที่ก๊อปปี้ได้ไม่จำกัด",
            "Container": "กล่องที่แพ็คแอปพลิเคชันพร้อมของจำเป็นครบชุด เปิดใช้ได้ทันทีบนเครื่องไหนก็ได้",
            "Dockerfile": "ไฟล์สูตรอาหารที่เขียนบอกขั้นตอนการสร้าง Image",
            "System Call": "ช่องทางเดียวที่โปรแกรมใช้ร้องขอให้ OS ทำอะไรให้ เหมือนเคาน์เตอร์บริการด่วน",
            "API": "คนกลางที่ช่วยให้โปรแกรมเมอร์เรียกใช้ OS ได้ง่าย ๆ โดยไม่ต้องรู้กลไกข้างใน",
            "POSIX": "มาตรฐานคำสั่งของระบบตระกูล Unix/Linux",
            "Win32": "ชุด API มาตรฐานของ Windows",
            "Register": "ที่เก็บข้อมูลจิ๋วความเร็วสูงสุดภายใน CPU ใช้ส่งค่าให้ System Call",
            "Monolithic Kernel": "แนวคิดเอาทุกบริการรวมไว้ใน Kernel เดียว — เร็ว แต่พังจุดเดียวน็อคทั้งระบบ",
            "Microkernel": "แนวคิดแยกบริการออกไป User Space เหลือแค่ส่งข้อความ — ปลอดภัยแต่ช้ากว่า",
            "Message Passing": "วิธีคุยกันระหว่างส่วนต่าง ๆ ของระบบโดยส่งข้อความไปหากัน",
            "Batch OS": "รวบงานเป็นกอง ๆ แล้วรันเรียงไปทีละกอง ไม่มีคนนั่งคุยกับเครื่อง",
            "Throughput": "ปริมาณงานที่เสร็จต่อช่วงเวลา ยิ่งมากยิ่งดี",
            "Time-sharing": "แบ่งเวลา CPU สลับกันเร็วมากจนผู้ใช้หลายคนรู้สึกเหมือนใช้เครื่องอยู่คนเดียว",
            "Real-time OS": "ระบบที่งานมีเส้นตาย ต้องเสร็จตรงเวลา ผิดนัดคือล้มเหลว",
            "Multiprogramming": "โหลดงานหลายตัวไว้ใน Memory ตัวไหนรอ I/O ก็สลับไปรันอีกตัว",
            "Multitasking": "สลับงานถี่มาก ๆ ด้วยช่วงเวลาสั้น ๆ เพื่อให้ผู้ใช้ interact ได้พร้อมกัน",
            "Time Quantum": "เวลา CPU ต่อรอบที่ Round Robin แบ่งให้แต่ละงาน",
            "Response Time": "เวลาที่รอตั้งแต่สั่งงานจนระบบเริ่มตอบสนองกลับมา",
            "Process": "โปรแกรมที่ถูกปลุกให้รันแล้ว มีหน่วยความจำและสถานะของตัวเอง",
            "Text Section": "ส่วนของโปรเซสที่เก็บโค้ดคำสั่ง",
            "Data Section": "ส่วนของโปรเซสที่เก็บตัวแปร Global",
            "Global Variables": "ตัวแปรที่ทุกส่วนของโปรแกรมเห็นร่วมกัน",
            "Heap": "พื้นที่จองหน่วยความจำเพิ่มระหว่างรัน (malloc)",
            "Stack": "พื้นที่เก็บตัวแปรชั่วคราวของฟังก์ชัน ทำงานเสร็จก็เก็บคืนอัตโนมัติ",
            "Program Counter": "เข็มชี้ว่ากำลังจะรันคำสั่งบรรทัดไหน",
            "Ready": "สถานะยืนรอคิวใช้ CPU — ทุกอย่างพร้อมแล้ว เหลือแค่รอเรียกตัว",
            "Running": "สถานะกำลังใช้ CPU ทำงาน",
            "Waiting": "สถานะหลบไปรออุปกรณ์ I/O ทำงานเสร็จ ระหว่างนี้ไม่ต้องใช้ CPU",
            "Job Queue": "คิวรวมของ Process ทั้งหมดในระบบ",
            "Ready Queue": "คิวของ Process ที่พร้อมรัน เหลือแค่รอ CPU ว่าง",
            "Device Queue": "คิวของ Process ที่กำลังรออุปกรณ์ I/O ทำงาน",
            "Context Switch": "การหยุดงานเก่าเก็บสภาพ แล้วโหลดงานใหม่เข้าสู่ CPU",

                            <li>กระโดดไปรัน ISR ใน Kernel Mode</li>

                            <DArrow x1={410} y1={97} x2={505} y2={97} label="Vector Table" color="#a16207" labelColor="#a16207" />
                        </Diagram>
                    </div>
                    <Glossary words={["OS", "Kernel", "Mode Bit", "Privileged Instructions", "Interrupt", "ISR", "Trap", "Firmware", "Resource Allocator", "Control Program", "Hardware", "Software", "CPU", "Exception", "Timer"]} />

            boot: (

                    <p className="text-slate-700">การบูตเครื่องคือลำดับขั้นที่พาเครื่องจาก "ไฟดับ" ไปจนถึงจุดที่ OS พร้อมใช้งาน โดยมีตัวละครหลักคือ <Term word="Bootstrap Program"><strong>Bootstrap Program</strong></Term> ที่ถูกฝังไว้ใน <Term word="Firmware"><u>Firmware</u></Term> (<Term word="ROM">ROM</Term>/EEPROM) ไม่ใช่บนดิสก์!</p>
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-300">
                        <h3 className="text-xl font-bold text-slate-900 mb-3"><i className="fa-solid fa-list-ol mr-2 text-blue-600"></i> ลำดับการบูต (ต้องจำเรียงให้ได้!)</h3>
                        <ol className="list-decimal ml-6 space-y-2 text-sm text-slate-700">
                            <li><strong>เปิดเครื่อง (Power On):</strong> CPU ถูกสั่งให้เริ่มรันโค้ด ณ Address พิเศษใน Firmware</li>
                            <li><Term word="POST"><strong>POST (Power-On Self-Test):</strong></Term> Firmware ตรวจสอบฮาร์ดแวร์พื้นฐาน (<Term word="RAM">RAM</Term>, CPU, การ์ดจอ)</li>
                            <li><Term word="Bootstrap Loader"><strong>Bootstrap Loader:</strong></Term> Firmware <Term word="Boot Sector">ค้นหา Boot Sector</Term> (<Term word="MBR">MBR</Term>/Boot Partition) เพื่อหา Bootloader (เช่น <Term word="GRUB">GRUB</Term>)</li>
                            <li><strong>โหลด Kernel:</strong> Bootloader นำ Kernel เข้า Memory และส่งต่อการควบคุมให้</li>

                    </div>
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-300">
                        <h3 className="text-xl font-bold text-emerald-600 mb-3"><i className="fa-solid fa-microchip mr-2"></i> BIOS vs UEFI</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-700">
                            <li><Term word="BIOS"><strong className="text-slate-900">BIOS:</strong></Term> รุ่นเก่า จำกัดขนาด Boot Sector 512 bytes (MBR) บูตช้า ใช้ Text UI</li>
                            <li><Term word="UEFI"><strong className="text-slate-900">UEFI:</strong></Term> รุ่นใหม่ รองรับพาร์ติชัน <Term word="GPT">GPT</Term>, <Term word="Secure Boot">Secure Boot</Term> (ตรวจ Signature ก่อนบูต), บูตเร็วขึ้น ใช้ GUI</li>

                    </div>
                    <Glossary words={["ROM", "POST", "Bootstrap Loader", "Boot Sector", "PID", "BIOS", "UEFI", "Secure Boot", "ROM", "RAM", "MBR", "GRUB", "GPT", "init", "systemd", "Bootstrap Program"]} />

                <div className="space-y-6">
                    <h2 className="text-3xl font-black text-blue-600 border-b border-slate-300 pb-2">2. OS Structure</h2>
                    
                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-300">
                        <h3 className="text-xl font-bold text-slate-900 mb-3"><i className="fa-solid fa-code mr-2 text-blue-600"></i> System Call (ประตูสู่ OS)</h3>
                        <p className="text-sm text-slate-700 mb-3">เมื่อโปรแกรมใน User Mode ต้องการใช้ทรัพยากร (เช่น อ่านไฟล์, สร้าง Process) จะ<Term word="System Call">ต้องทำผ่าน <strong>System Call</strong></Term> ซึ่งจะเป็นการ Trigger ให้เกิด <Term word="Trap">Software Interrupt (Trap)</Term> เพื่อเปลี่ยนจาก User Mode ไปเป็น Kernel Mode</p>
                        <ul className="list-disc ml-6 space-y-1 text-sm text-slate-700">
                            <li>เรามักไม่เรียก System Call ตรงๆ แต่<Term word="API">เรียกผ่าน <strong>API</strong></Term> (Application Programming Interface)</li>
                            <li>ตัวอย่าง API: <Term word="POSIX"><span className="text-blue-600">POSIX API</span></Term> (สำหรับ Linux/Unix), <Term word="Win32"><span className="text-blue-600">Win32 API</span></Term> (สำหรับ Windows)</li>
                        </ul>
                        <h4 className="text-slate-900 font-bold text-sm mt-4 mb-2">เบื้องหลังการเรียก System Call (5 ขั้นตอน):</h4>
                        <ol className="list-decimal ml-6 space-y-1 text-sm text-slate-700">
                            <li>โปรแกรมเรียกฟังก์ชัน API (เช่น <code className="text-amber-600">printf</code> ภายในไปเรียก <code className="text-amber-600">write()</code>)</li>
                            <li>API ใส่ "เบอร์ของ System Call" และ <Term word="Parameter">parameters</Term> <Term word="Register">ลงใน Register</Term> (หรือ Stack)</li>
                            <li>เรียกคำสั่ง Trap → CPU เปลี่ยน Mode Bit เป็น 0 (เข้า Kernel Mode)</li>
                            <li>Kernel เปิดตาราง System Call Table หา <Term word="Handler">Handler</Term> ที่ตรงกับเบอร์ → รันบริการนั้นให้</li>
                            <li>คืนผลลัพธ์กลับโปรแกรม พร้อมสลับกลับ User Mode</li>
                        </ol>
                        <Diagram title="เส้นทางการเรียก System Call" w={680} h={150}>
                            <DBox x={20} y={70} w={140} h={55} title="User Program" sub="printf / write" stroke="#2563eb" />
                            <DBox x={215} y={70} w={130} h={55} title="API" sub="POSIX / Win32" stroke="#7c3aed" />
                            <DBox x={400} y={70} w={140} h={55} title="System Call" sub="Trap → Mode bit 0" stroke="#a16207" />
                            <DBox x={560} y={70} w={100} h={55} title="Kernel" sub="ให้บริการ" stroke="#16a34a" />
                            <DArrow x1={160} y1={97} x2={210} y2={97} color="#2563eb" />
                            <DArrow x1={345} y1={97} x2={395} y2={97} color="#7c3aed" />
                            <DArrow x1={540} y1={97} x2={555} y2={97} color="#a16207" />
                        </Diagram>

                    <div className="bg-slate-50 p-5 rounded-xl border border-emerald-300">
                        <h3 className="text-xl font-bold text-emerald-600 mb-3"><Term word="Context Switch"><i className="fa-solid fa-shuffle mr-2"></i> Context Switch</Term> (สับเปลี่ยน Process)</h3>

                        <h3 className="text-xl font-bold text-slate-900 mb-3"><Term word="fork()"><i className="fa-solid fa-code-branch mr-2 text-blue-600"></i> fork()</Term> — สร้างลูก</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-700">

                            <li><strong className="text-emerald-600">ค่าที่คืนกลับ (ต้องจำ!):</strong> Parent ได้ PID ของลูก (&gt; 0), Child ได้ 0, Error ได้ -1</li>
                            <li>หลัง fork() ทั้งแม่และลูกจะรันโค้ดบรรทัดถัดไป <u>พร้อมกัน</u> — ลำดับการรันขึ้นกับ Scheduler (ไม่แน่นอน!)</li>
                            <li>Memory แยกกันเด็ดขาด: ลูกแก้ตัวแปร ไม่กระทบแม่ (จริง ๆ ใช้เทคนิค <Term word="Copy-on-Write">Copy-on-Write</Term> เพื่อประหยัด)</li>
                            <li>จำนวน process หลัง fork() n ครั้ง = 2<sup>n</sup> ตัว (กับดักยอดฮิต! ไม่ใช่ n+1)</li>
                        </ul>

                        <h3 className="text-xl font-bold text-slate-900 mb-3"><i className="fa-solid fa-wand-magic-sparkles mr-2 text-purple-600"></i> exec() — แปลงร่าง</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-700">

                            </div>
                            <div className="bg-white p-4 rounded border border-slate-300">
                                <Term word="_exit()"><strong className="text-orange-600 block mb-1">_exit(status)</strong></Term>

                            </div>

                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-300">

                    <h2 className="text-3xl font-black text-blue-600 border-b border-slate-300 pb-2">6. CPU Scheduling</h2>
                    <p className="text-slate-700">เมื่อมี Process อยู่ใน Ready Queue หลายตัว <Term word="Scheduler"><strong>Short-term Scheduler</strong></Term> (<Term word="Dispatcher">Dispatcher)</Term> ต้องตัดสินใจว่าจะเลือกใครเข้าไปรันใน CPU</p>

                    <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                        <div className="bg-slate-50 p-4 rounded-xl border-l-4 border-red-500">
                            <Term word="Non-preemptive"><strong className="text-slate-900 block mb-1">Non-preemptive</strong></Term>
                            เมื่อ Process ได้ CPU แล้ว จะรันจนกว่าจะเสร็จ หรือยอมสละ CPU เอง OS แทรกแซงดึง CPU คืนไม่ได้
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border-l-4 border-green-500">
                            <Term word="Preemptive"><strong className="text-slate-900 block mb-1">Preemptive</strong></Term>
                            OS สามารถ "แย่ง (ขัดจังหวะ)" CPU คืนจาก Process ที่รันอยู่ได้ตามต้องการ (เช่น หมดเวลาโควต้า)
                        </div>
                    </div>

                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-300">
                        <h3 className="text-xl font-bold text-slate-900 mb-4">อัลกอริทึมยอดฮิต (เก็งข้อสอบ!)</h3>
                        <div className="space-y-4 text-sm text-slate-700">
                            <div>
                                <strong className="text-blue-600 text-base block">1. <Term word="FCFS">FCFS</Term> (First-Come, First-Served)</strong>
                                ใครมาก่อนได้ทำก่อน (Non-preemptive). <br/>
                                <span className="text-red-600">ปัญหา (Trap):</span> <Term word="Convoy Effect"><b>Convoy Effect</b></Term> หากงานใหญ่มาก่อน งานเล็กๆ ข้างหลังจะรอนานมาก (Waiting time เฉลี่ยสูง)
                            </div>
                            <div>
                                <strong className="text-blue-600 text-base block">2. <Term word="SJF">SJF</Term> (Shortest Job First)</strong>
                                <Term word="Burst Time">ใครใช้เวลาทำ (Burst time)</Term> น้อยสุด ได้ทำก่อน (Non-preemptive). ให้ Waiting time เฉลี่ยต่ำที่สุด!
                                <br/><span className="text-red-600">ปัญหา:</span> ในชีวิตจริง เราไม่รู้ล่วงหน้าว่า Process จะใช้เวลาเท่าไหร่
                            </div>
                            <div>
                                <strong className="text-blue-600 text-base block">3. <Term word="Priority Scheduling">Priority Scheduling</Term></strong>
                                กำหนด "สิทธิ (Priority)" ใครสิทธิสูงกว่าได้ทำก่อน (เช่น Java Thread กำหนด 1-10)
                                <br/><span className="text-red-600">ปัญหา (Trap):</span> <Term word="Starvation"><b>Starvation (อดตาย)</b></Term> Process ที่สิทธิต่ำมากๆ อาจไม่ถูกเรียกเลยตลอดกาล!
                                <br/><span className="text-green-600">ทางแก้:</span> <Term word="Aging"><b>Aging</b></Term> ค่อยๆ เพิ่มสิทธิให้ Process ที่รอนานๆ เมื่อเวลาผ่านไป
                            </div>
                            <div>
                                <strong className="text-blue-600 text-base block">4. <Term word="Round Robin">Round Robin</Term> (RR)</strong>
                                จัดคิวแบบวนรอบ ทุกคนจะได้เวลาคนละนิด <Term word="Time Quantum">เรียกว่า <b>Time Quantum (q)</b></Term> (Preemptive). 
                                เหมาะกับระบบ Interactive ที่ต้องการ Response time ที่ดี
                                <br/><span className="text-amber-600">จุดสังเกต:</span> ถ้า q มากไป จะกลายเป็น FCFS. ถ้า q น้อยไป Context Switch Overhead จะบานตะไท!
                            </div>
                            <div>
                                <strong className="text-blue-600 text-base block">5. <Term word="SRTF">SRTF</Term> (Shortest Remaining Time First)</strong>
                                เวอร์ชัน Preemptive ของ SJF — ทุกครั้งที่มี Process ใหม่มาถึง ระบบจะเทียบว่า "เวลาที่เหลือ (<Term word="Remaining Time">Remaining Time</Term>)" ของใครน้อยกว่า ถ้าน้องใหม่น้อยกว่าตัวที่รันอยู่ จะโดน <b>แย่ง CPU ทันที</b>
                                <br/><span className="text-green-600">ข้อดี:</span> Average Waiting Time ต่ำที่สุด
                                <br/><span className="text-red-600">ข้อเสีย:</span> Starvation + Overhead จาก Context Switch บ่อย
                            </div>
                            <div>
                                <strong className="text-blue-600 text-base block">6. <Term word="MLQ">Multilevel Queue (MLQ)</Term></strong>
                                แบ่ง Ready Queue เป็นชั้น ๆ ตามประเภทงาน (เช่น งาน System, งาน Interactive, งาน Batch) แต่ละชั้นมี Algorithm ของตัวเอง
                                <br/><span className="text-red-600">ข้อจำกัด:</span> Process จะ<u>ติดอยู่ชั้นเดิมตลอดชีวิต</u> ย้ายชั้นไม่ได้
                            </div>
                            <div>
                                <strong className="text-blue-600 text-base block">7. <Term word="MLFQ">Multilevel Feedback Queue (MLFQ)</Term></strong>
                                พัฒนาจาก MLQ — Process <b>ย้ายชั้นได้</b> ตามพฤติกรรม เช่น ใช้ CPU เยอะ (เกิน q) จะถูกลดชั้นลง ส่วน Process ที่รอนานจะถูกเลื่อนชั้นขึ้น (คล้าย Aging)
                                <br/><span className="text-green-600">ฉลาดกว่า MLQ:</span> ปรับตัวตามพฤติกรรมของงานได้
                            </div>
                        </div>
                    </div>

                { type: 'fill', q: "ฟังก์ชันที่ให้ Parent รอ Child ที่เจาะจง PID ได้ (ต่างจาก wait() ที่รอตัวไหนก็ได้) ชื่อว่าอะไร?", ans: ["waitpid"], exp: "waitpid(pid, &status, options) — ระบุ PID ได้ และใช้ WNOHANG เพื่อเช็คแบบไม่ block" },
                { type: 'fill', q: "เทคนิคแก้ปัญหา Starvation ใน Priority Scheduling เรียกว่าอะไร?", ans: ["aging"], exp: "Aging — ค่อย ๆ เพิ่ม Priority ให้ Process ที่รอนาน จนในที่สุดได้รัน" },
                { type: 'fill', q: "โปรแกรมแรกที่ Kernel เรียกใช้หลังบูตเสร็จ (PID 1) ชื่อว่าอะไร?", ans: ["init", "systemd"], exp: "init (ระบบเก่า) หรือ systemd (ระบบใหม่) คือโปรเซสแรกของ User Space" },
                { type: 'fill', q: "Q: P1=6, P2=8, P3=7, P4=3 (SJF, มาพร้อมกัน) Average Waiting Time = ? (ตอบเป็นตัวเลข)", ans: ["7"], exp: "ลำดับ: P4(3) → P1(6) → P3(7) → P2(8) ได้ WT = 0, 3, 9, 16 → เฉลี่ย 7" },
                { type: 'fill', q: "เรียก fork() 2 ครั้งติดต่อกัน จะมี Process ทั้งหมดกี่ตัว? (ตอบเป็นตัวเลข)", ans: ["4"], exp: "2^2 = 4 ตัว (รวม Parent) — อย่าตอบ 3!" },
                { type: 'fill', q: "การจำลองเครื่องคอมพิวเตอร์ทั้งเครื่องด้วยซอฟต์แวร์ เรียกว่าอะไร? (ภาษาอังกฤษ)", ans: ["virtual machine", "vm"], exp: "Virtual Machine — มี Guest OS เต็มตัวของตัวเอง ต่างจาก Container ที่แชร์ Kernel" },
                { type: 'fill', q: "ซอฟต์แวร์ที่ทำหน้าที่แบ่งปัน Hardware จริงให้ VM หลาย ๆ ตัว เรียกว่าอะไร?", ans: ["hypervisor"], exp: "Hypervisor (VMM) — แบ่งเป็น Type 1 (bare-metal) และ Type 2 (hosted)" },
                { type: 'fill', q: "FCFS: P1=5, P2=10 มาถึงพร้อมกัน Turnaround Time ของ P2 = ? (ตอบเป็นตัวเลข)", ans: ["15"], exp: "P1 เสร็จที่ 5 → P2 เสร็จที่ 15 → TAT(P2) = 15 − 0 = 15" },
                { type: 'fill', q: "Round Robin q=4: P1=10, P2=4 มาพร้อมกัน (P1 เริ่มก่อน) — P2 ทำงานเสร็จที่เวลาเท่าไร?", ans: ["8"], exp: "P1 รัน 0-4 → P2 รัน 4-8 (burst แค่ 4 หมดพอดี) → P2 เสร็จที่เวลา 8" },
                { type: 'fill', q: "API มาตรฐานของระบบ Unix/Linux ชื่อว่าอะไร?", ans: ["posix"], exp: "POSIX — มาตรฐานคำสั่งให้โปรแกรมเขียนครั้งเดียวใช้ได้หลายระบบตระกูล Unix" },
                { type: 'fill', q: "สถานะของ Process ที่กำลังรออุปกรณ์ I/O ทำงาน เรียกว่าอะไร? (ภาษาอังกฤษ)", ans: ["waiting", "blocked"], exp: "Waiting (Blocked) — ไม่ใช้ CPU ระหว่างรอ I/O เสร็จแล้วจะกลับไป Ready" },
                { type: 'fill', q: "SJF เลือกงานจากอะไร? (เกณฑ์ที่ใช้เรียงลำดับ)", ans: ["burst time"], exp: "Burst Time — ใครใช้เวลา CPU สั้นสุดได้ก่อน ให้ Average Waiting Time ต่ำสุด" },
                { type: 'fill', q: "ใช้ waitpid() แบบไม่ block (เช็คแล้วคืนทันที) ต้องระบุ flag ชื่ออะไร?", ans: ["wnohang"], exp: "waitpid(pid, &status, WNOHANG) — ถ้าลูกยังไม่จบจะคืน 0 ทันที ไม่ต้องรอ" },
                { type: 'fill', q: "ตัวอย่างของระบบ Real-time OS ที่พลาด Deadline แล้วถือว่าล้มเหลว (รุนแรงที่สุด) เรียกว่าอะไร?", ans: ["hard real-time", "hard"], exp: "Hard Real-time เช่น ระบบเบรกรถ ระบบการบิน ส่วน Soft Real-time พลาดได้บ้าง เช่น มัลติมีเดีย" },
                { type: 'fill', q: "P1=10, P2=2 มาถึงพร้อมกัน ใช้ FCFS (P1 เริ่มก่อน) Average Waiting Time = ? (ตอบเป็นตัวเลข)", ans: ["5"], exp: "WT: P1 = 0, P2 = 10 → เฉลี่ย (0+10)/2 = 5" },
                { type: 'fill', q: "เรียก fork() 4 ครั้งติดต่อกัน จะมี Process ทั้งหมดกี่ตัว?", ans: ["16"], exp: "2^4 = 16 ตัว — ทวีคูณทุกครั้งที่ fork ไม่ใช่บวกเพิ่ม" },
                { type: 'fill', q: "อัลกอริทึมที่เลือกงานตาม Priority สูงสุดก่อน เรียกว่าอะไร?", ans: ["priority scheduling", "priority"], exp: "Priority Scheduling — ปัญหาคือ Starvation แก้ด้วย Aging" },
                { type: 'fill', q: "เทคนิคที่หลัง fork() แล้วไม่ก๊อปปี้ Memory ทันที แต่ก๊อปปี้เฉพาะเมื่อมีการเขียน เรียกว่าอะไร?", ans: ["copy-on-write", "copy on write", "cow"], exp: "Copy-on-Write — ประหยัด Memory เพราะแม่กับลูกแชร์ข้อมูลเดิมจนกว่าฝ่ายใดฝ่ายหนึ่งจะเขียน" },
                { type: 'fill', q: "ฟังก์ชันในตระกูล exec ที่ค้นหาโปรแกรมจาก PATH อัตโนมัติ ชื่อว่าอะไร? (ตอบชื่อใดชื่อหนึ่ง)", ans: ["execlp", "execvp"], exp: "execlp / execvp — ตัว p = ค้นจาก PATH ไม่ต้องระบุพาธเต็ม" },
                { type: 'fill', q: "สัญญาณที่ใช้ฆ่า Process ทันทีโดยที่ Process ไม่มีโอกาสปฏิเสธ ชื่อว่าอะไร?", ans: ["sigkill"], exp: "SIGKILL ฆ่าทันทีปฏิเสธไม่ได้ ต่างจาก SIGTERM ที่ขอให้จบอย่างสุภาพ" },
                { type: 'fill', q: "API มาตรฐานของ Windows ชื่อว่าอะไร?", ans: ["win32", "win32 api"], exp: "Win32 API — ของ Windows ส่วน Unix/Linux ใช้ POSIX" },
                { type: 'fill', q: "Mode Bit = 0 หมายความว่า CPU อยู่ในโหมดอะไร?", ans: ["kernel mode", "kernel"], exp: "Kernel Mode (bit 0) มีสิทธิเต็ม — User Mode คือ bit 1" },
                { type: 'fill', q: "RR q=5: P1=12, P2=5 มาพร้อมกัน (P1 เริ่มก่อน) — P2 ทำงานเสร็จที่เวลาเท่าไร?", ans: ["10"], exp: "P1 รัน 0-5 → P2 รัน 5-10 (burst พอดี) → P2 เสร็จที่ 10" },
                { type: 'fill', q: "ผู้ที่ทำหน้าที่หยิบ Process จาก Ready Queue ส่งเข้า CPU เรียกว่าอะไร?", ans: ["dispatcher", "scheduler", "short-term scheduler"], exp: "Dispatcher (Short-term Scheduler) — เป็นส่วนหนึ่งของ Scheduler ที่ลงมือสลับงานจริง" }
            ];

            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExp, setShowExp] = useState(false);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [fillInput, setFillInput] = useState("");
            const [wrongFill, setWrongFill] = useState(false);

            const q = questions[currentQ];

            const handleTf = (idx) => {
                if (showExp) return;
                setSelected(idx);
                setShowExp(true);
                if (idx === (q.ans ? 0 : 1)) setScore(score + 2);
                else setScore(score - 1);
            };

            const handleSkip = () => {
                setSelected(null); setShowExp(false); setWrongFill(false); setFillInput("");
                if (currentQ < questions.length - 1) setCurrentQ(currentQ + 1);
                else setFinished(true);
            };

            const handleFill = () => {
                if (showExp) return;
                const norm = fillInput.trim().toLowerCase().replace(/\s+/g, ' ');
                const ok = q.ans.some(a => norm === a.toLowerCase());
                setShowExp(true);
                setWrongFill(!ok);
                if (ok) setScore(score + 2);
            };

            const nextQ = () => {
                setSelected(null); setShowExp(false); setWrongFill(false); setFillInput("");
                if (currentQ < questions.length - 1) setCurrentQ(currentQ + 1);
                else setFinished(true);
            };

            if (finished) {
                const totalTf = questions.filter(x => x.type === 'tf').length * 2;
                const totalFill = questions.filter(x => x.type === 'fill').length * 2;
                return (
                    <React.Fragment>
                        <PrintSheet questions={questions} mode="real" title="ข้อสอบจำลอง (รูปแบบจริง)" />
                        <div className="no-print bg-slate-50 p-10 rounded-xl text-center border border-slate-300 shadow-2xl animate-fade-in max-w-2xl mx-auto">
                            <h2 className="text-4xl font-black text-slate-900 mb-6">สอบเสร็จแล้ว! 🎉</h2>
                            <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-4">{score} / {totalTf + totalFill}</div>
                            <p className="text-slate-600 text-sm mb-8">(ถูก/ผิด: ถูก +2 ผิด -1 เว้น 0 | เติมคำ: ถูก +2 ผิด 0)</p>
                            <p className="text-slate-700 text-lg mb-8">
                                {score >= (totalTf + totalFill) * 0.7 ? 'เยี่ยมมาก! คะแนนระดับนี้พร้อมลุยสนามจริงแล้ว!' : 'ยังมีจุดที่ต้องทบทวน กลับไปอ่านบทที่พลาดอีกรอบนะครับ'}
                            </p>
                            <button onClick={() => {setFinished(false); setCurrentQ(0); setScore(0); setSelected(null); setShowExp(false); setFillInput("");}} className="bg-blue-600 hover:bg-blue-500 text-slate-900 font-bold py-3 px-8 rounded-full transition shadow-lg">
                                ลองทำใหม่อีกครั้ง
                            </button>
                        </div>
                    </React.Fragment>
                );
            }

            return (
                <React.Fragment>
                    <PrintSheet questions={questions} mode="real" title="ข้อสอบจำลอง (รูปแบบจริง)" />
                    <div className="no-print bg-slate-50 p-8 rounded-xl border border-slate-300 shadow-2xl max-w-3xl mx-auto animate-fade-in">
                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-300">
                        <span className="text-blue-600 font-bold bg-blue-100 px-3 py-1 rounded">ข้อ {currentQ + 1} / {questions.length} <span className="ml-2 text-xs text-slate-600">{q.type === 'tf' ? '[ถูก/ผิด]' : '[เติมคำ]'}</span></span>
                        <span className="text-slate-600 font-bold">Score: <span className="text-emerald-600">{score}</span></span>
                    </div>

                    <h3 className="text-xl text-slate-900 font-semibold mb-6 whitespace-pre-wrap leading-relaxed">{q.q}</h3>

                    {q.type === 'tf' ? (
                        <div className="space-y-3 mb-8">
                            <div className="grid grid-cols-2 gap-3">
                                {["ถูก", "ผิด"].map((opt, idx) => {
                                    let cls = "w-full text-left p-4 rounded-lg border-2 transition-all duration-200 font-bold text-center ";
                                    if (!showExp) cls += "border-slate-300 hover:border-blue-500 bg-slate-100 hover:bg-slate-100 text-slate-700";
                                    else if (idx === (q.ans ? 0 : 1)) cls += "border-emerald-500 bg-emerald-100 text-emerald-600";
                                    else if (idx === selected) cls += "border-red-500 bg-red-100 text-red-600";
                                    else cls += "border-slate-200 bg-slate-100 text-slate-600 opacity-50";
                                    return (
                                        <button key={idx} onClick={() => handleTf(idx)} disabled={showExp} className={cls}>
                                            {idx === 0 ? <i className="fa-solid fa-circle-check mr-2"></i> : <i className="fa-solid fa-circle-xmark mr-2"></i>} {opt}
                                        </button>
                                    );
                                })}
                            </div>
                            {!showExp && (
                                <button onClick={handleSkip} className="w-full p-3 rounded-lg border-2 border-dashed border-slate-300 text-slate-600 hover:bg-slate-100 transition text-sm font-medium">
                                    ข้ามข้อนี้ (ได้ 0 คะแนน ไม่ติดลบ)
                                </button>
                            )}
                        </div>
                    ) : (
                        <div className="space-y-3 mb-8">
                            <div className="flex gap-3">
                                <input
                                    type="text"
                                    value={fillInput}
                                    onChange={(e) => setFillInput(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === 'Enter') handleFill(); }}
                                    disabled={showExp}
                                    placeholder="พิมพ์คำตอบ..."
                                    className="flex-1 bg-white border-2 border-slate-300 focus:border-blue-500 rounded-lg px-4 py-3 text-slate-900 outline-none disabled:opacity-50 font-mono"
                                />
                                <button onClick={handleFill} disabled={showExp || !fillInput.trim()} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-slate-900 font-bold rounded-lg transition disabled:opacity-50">
                                    ตรวจคำตอบ
                                </button>
                            </div>
                            {!showExp && (
                                <button onClick={handleSkip} className="w-full p-3 rounded-lg border-2 border-dashed border-slate-300 text-slate-600 hover:bg-slate-100 transition text-sm font-medium">
                                    ข้ามข้อนี้ (ได้ 0 คะแนน)
                                </button>
                            )}
                        </div>
                    )}

                    {showExp && (
                        <div className={`bg-white p-5 rounded-lg border border-slate-300 mb-6 animate-fade-in border-l-4 ${(q.type === 'tf' ? selected === (q.ans ? 0 : 1) : !wrongFill) ? 'border-l-emerald-500' : 'border-l-red-500'}`}>
                            <h4 className="font-bold text-slate-900 mb-2 flex items-center">
                                {(q.type === 'tf' ? selected === (q.ans ? 0 : 1) : !wrongFill) ? <span className="text-emerald-600"><i className="fa-solid fa-circle-check mr-2"></i> ตอบถูก (+2)</span> : <span className="text-red-600"><i className="fa-solid fa-circle-xmark mr-2"></i> {q.type === 'tf' ? 'ตอบผิด (-1)' : 'ตอบผิด (0)'}</span>}
                            </h4>
                            <p className="text-slate-700 text-sm leading-relaxed">{q.exp}</p>
                            {q.type === 'tf' && <p className="text-slate-600 text-xs mt-2">คำตอบที่ถูกต้องคือ: <strong className="text-emerald-600">{q.ans ? 'ถูก' : 'ผิด'}</strong></p>}
                            {q.type === 'fill' && <p className="text-slate-600 text-xs mt-2">คำตอบที่ยอมรับ: <strong className="text-emerald-600">{q.ans.join(' / ')}</strong></p>}
                        </div>
                    )}

                    {showExp && (
                        <button onClick={nextQ} className="w-full bg-blue-600 hover:bg-blue-500 text-slate-900 font-bold py-4 px-4 rounded-lg transition-colors shadow-lg text-lg">
                            {currentQ < questions.length - 1 ? 'ข้อถัดไป ➔' : 'ดูผลคะแนน ➔'}
                        </button>
                    )}
                    </div>
                </React.Fragment>
            );
        };

        // --- Main App Layout ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('intro');

            const menuItems = [
                { id: 'intro', icon: 'fa-desktop', label: 'Intro to OS' },
                { id: 'boot', icon: 'fa-power-off', label: 'ขั้นตอนการบูตเครื่อง' },
                { id: 'virt', icon: 'fa-box', label: 'VM & Container' },
                { id: 'structure', icon: 'fa-sitemap', label: 'OS Structure' },
                { id: 'ostypes', icon: 'fa-layer-group', label: 'ประเภทของ OS' },
                { id: 'process1', icon: 'fa-memory', label: 'Process Concept 1' },
                { id: 'process2', icon: 'fa-shuffle', label: 'Process Concept 2' },
                { id: 'processmgmt', icon: 'fa-code-branch', label: 'fork / exec / wait' },
                { id: 'thread', icon: 'fa-network-wired', label: 'Intro to Thread' },
                { id: 'scheduling', icon: 'fa-microchip', label: 'CPU Scheduling' },
                { id: 'anim', icon: 'fa-clapperboard', label: 'Process Animation', isHighlight: true },
                { id: 'strategy', icon: 'fa-crosshairs', label: 'กลยุทธ์ทำข้อสอบ', isHighlight: true },
                { id: 'realquiz', icon: 'fa-clipboard-check', label: 'ข้อสอบจำลอง (รูปแบบจริง)', isHighlight: true },
                { id: 'quiz', icon: 'fa-clipboard-question', label: 'Quiz ทบทวน (MCQ)' }
            ];

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
                    {/* Sidebar */}
                    <aside className="no-print w-full md:w-72 bg-white border-r border-slate-200 flex flex-col shadow-2xl z-20">
                        <div className="p-6 border-b border-slate-200">
                            <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-emerald-600 drop-shadow-md tracking-tight">
                                OS Masterclass
                            </h1>
                            <p className="text-slate-600 text-xs mt-2 uppercase tracking-[0.2em] font-bold">Midterm Edition</p>
                            <button
                                onClick={() => window.print()}
                                className="no-print mt-4 w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-900 hover:bg-slate-700 text-white text-sm font-bold rounded-lg transition shadow"
                            >
                                <i className="fa-solid fa-file-pdf"></i> บันทึกหน้านี้เป็น PDF
                            </button>
                            <p className="text-slate-600 text-[10px] mt-2 leading-relaxed">เลือกหัวข้อทางซ้าย แล้วกดปุ่มเพื่อพิมพ์/บันทึก PDF เข้าห้องสอบ (ปริ้นท์หัวข้อที่เปิดอยู่)</p>
                        </div>
                        
                        <nav className="flex-1 overflow-y-auto p-4 space-y-1">
                            {menuItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)} 
                                    className={`w-full flex items-center px-4 py-3 rounded-lg transition-all duration-200 text-sm font-medium ${
                                        activeTab === item.id 
                                        ? 'bg-blue-100 text-blue-600 border border-blue-600 shadow-inner' 
                                        : item.isHighlight 
                                            ? 'text-amber-600 hover:bg-slate-50 hover:text-amber-600 mt-4 border border-slate-200' 
                                            : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                                    }`}
                                >
                                    <i className={`fa-solid ${item.icon} w-6 text-center mr-2 ${activeTab === item.id ? 'text-blue-600' : ''}`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 md:p-10 lg:p-12 overflow-y-auto bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-100 via-slate-50 to-slate-100">
                        {/* Render standard content blocks */}
                        {contentData[activeTab] && (
                            <div className="max-w-4xl mx-auto animate-fade-in">
                                {contentData[activeTab]}
                                
                                {/* Show Sample Code in Process Concept sections for extra completeness */}
                                {activeTab === 'process1' && (
                                    <CodeBlock 
                                        language="c" 
                                        code={`#include <stdio.h>\n#include <unistd.h>\n\nint global_var = 0; // Data Section\n\nint main() {\n    int local_var = 1; // Stack\n    int *heap_ptr = malloc(sizeof(int)); // Heap\n    return 0;\n}`} 
                                    />
                                )}
                            </div>
                        )}

                        {/* Render special components */}
                        {activeTab === 'anim' && <div className="max-w-5xl mx-auto"><ProcessAnimation /></div>}
                        {activeTab === 'realquiz' && <div className="max-w-4xl mx-auto"><RealQuiz /></div>}
                        {activeTab === 'quiz' && <div className="max-w-4xl mx-auto"><Quiz /></div>}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <React.Fragment>
                <App />
                <TermPopover />
            </React.Fragment>
        );
