<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Midterm Masterclass</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Animation specific styles */
        .process-box { transition: all 0.5s ease-in-out; }
        .zombie-state { filter: grayscale(100%); opacity: 0.6; border: 2px dashed #94a3b8; }
        .exec-state { background: linear-gradient(135deg, #4c1d95, #7c3aed); border-color: #a78bfa; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper Component: Syntax Highlighted Code Block ---
        const CodeBlock = ({ code, language = "c" }) => {
            const highlight = (text) => {
                let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                // Keywords
                html = html.replace(/\b(int|pid_t|if|else|return|void|char|NULL)\b/g, '<span class="text-pink-400 font-bold">$1</span>');
                // Functions
                html = html.replace(/\b(fork|wait|waitpid|exit|execlp|printf)\b/g, '<span class="text-blue-300">$1</span>');
                // Strings
                html = html.replace(/("[^"]*")/g, '<span class="text-yellow-300">$1</span>');
                // Comments
                html = html.replace(/(\/\/.*)/g, '<span class="text-emerald-500/70 italic">$1</span>');
                // Numbers
                html = html.replace(/\b(\d+)\b/g, '<span class="text-purple-300">$1</span>');
                return { __html: html };
            };

            return (
                <div className="relative group rounded-xl overflow-hidden shadow-lg border border-slate-700/50 mt-4 mb-6">
                    <div className="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center text-xs text-slate-400 font-mono">
                        <span>Code ({language})</span>
                        <div className="flex gap-2"><div className="w-3 h-3 rounded-full bg-red-500"></div><div className="w-3 h-3 rounded-full bg-yellow-500"></div><div className="w-3 h-3 rounded-full bg-green-500"></div></div>
                    </div>
                    <pre className="bg-slate-950 p-4 overflow-x-auto text-sm font-mono leading-relaxed"><code dangerouslySetInnerHTML={highlight(code)} /></pre>
                </div>
            );
        };

        // --- SVG Diagram Helpers ---
        const Diagram = ({ title, w = 680, h = 220, children }) => (
            <div className="mt-5 bg-slate-900/70 rounded-xl border border-slate-700/60 p-4">
                <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2"><i className="fa-solid fa-diagram-project mr-2"></i>{title}</div>
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto select-none">{children}</svg>
            </div>
        );

        const DBox = ({ x, y, w = 150, h = 60, title, sub, fill = '#1e293b', stroke = '#3b82f6', text = '#f1f5f9', titleSize = 13 }) => {
            const cx = x + w / 2;
            const subs = sub ? (Array.isArray(sub) ? sub : [sub]) : [];
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx={8} fill={fill} stroke={stroke} strokeWidth={1.5} />
                    <text x={cx} y={y + h / 2 - (subs.length ? subs.length * 7 : -5)} textAnchor="middle" fill={text} fontSize={titleSize} fontWeight="bold">{title}</text>
                    {subs.map((s, i) => (
                        <text key={i} x={cx} y={y + h / 2 + 6 + i * 14} textAnchor="middle" fill="#94a3b8" fontSize="10.5">{s}</text>
                    ))}
                </g>
            );
        };

        const DCode = ({ x, y, w = 260, h = 95, title, code, stroke = '#3b82f6', titleColor = '#93c5fd' }) => {
            const lines = code.split('\n');
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx={8} fill="#0f172a" stroke={stroke} strokeWidth={1.5} />
                    <text x={x + 12} y={y + 18} fontSize="11" fontWeight="bold" fill={titleColor}>{title}</text>
                    <line x1={x} y1={y + 26} x2={x + w} y2={y + 26} stroke="#334155" strokeWidth={1} />
                    {lines.map((l, i) => (
                        <text key={i} x={x + 12} y={y + 42 + i * 15} fontSize="10.5" fontFamily="monospace" fill="#e2e8f0">{l}</text>
                    ))}
                </g>
            );
        };

        const DArrow = ({ x1, y1, x2, y2, label, dashed = false, color = '#94a3b8', labelColor = '#cbd5e1', lx = 0, ly = 0 }) => {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len === 0) return null;
            const ux = dx / len, uy = dy / len;
            const ax = x2 - 9 * ux + 4 * uy, ay = y2 - 9 * uy - 4 * ux;
            const bx = x2 - 9 * ux - 4 * uy, by = y2 - 9 * uy + 4 * ux;
            const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            return (
                <g>
                    <line x1={x1} y1={y1} x2={x2 - 5 * ux} y2={y2 - 5 * uy} stroke={color} strokeWidth={1.5} strokeDasharray={dashed ? '5,4' : undefined} />
                    <polygon points={`${x2},${y2} ${ax},${ay} ${bx},${by}`} fill={color} />
                    {label && <text x={mx - 10 * uy + lx} y={my + 10 * ux + ly - 4} textAnchor="middle" fill={labelColor} fontSize="10">{label}</text>}
                </g>
            );
        };

        const Gantt = ({ segments, ticks, unit = 'ms' }) => {
            const SCALE = 20, X0 = 90, Y = 16, H = 44;
            const maxT = Math.max(...ticks.map(t => t.t));
            return (
                <svg viewBox={`0 0 ${X0 + maxT * SCALE + 40} 92`} className="w-full h-auto select-none">
                    {segments.map((s, i) => (
                        <g key={i}>
                            <rect x={X0 + s.start * SCALE} y={Y} width={(s.end - s.start) * SCALE} height={H} fill={s.color} opacity="0.25" stroke={s.color} strokeWidth={1.5} />
                            <text x={X0 + ((s.start + s.end) / 2) * SCALE} y={Y + H / 2 + 4} textAnchor="middle" fill="#f1f5f9" fontSize="11" fontWeight="bold">{s.label}</text>
                        </g>
                    ))}
                    {ticks.map((tk, i) => (
                        <g key={i}>
                            <line x1={X0 + tk.t * SCALE} y1={Y + H} x2={X0 + tk.t * SCALE} y2={Y + H + 6} stroke="#64748b" strokeWidth={1} />
                            <text x={X0 + tk.t * SCALE} y={Y + H + 18} textAnchor="middle" fill="#94a3b8" fontSize="10">{tk.label}</text>
                        </g>
                    ))}
                    <text x={12} y={Y + H / 2 + 4} fill="#64748b" fontSize="10">เวลา</text>
                </svg>
            );
        };

        // --- Glossary: ศัพท์เฉพาะอธิบายแบบง่ายสุด ---
        const Glossary = ({ title = "ศัพท์ต้องรู้ในหน้านี้ (ฉบับคนไม่เคยเรียน)", terms }) => (
            <div className="bg-slate-800/70 p-5 rounded-xl border border-cyan-900/60 mt-6">
                <h3 className="text-xl font-bold text-cyan-400 mb-4"><i className="fa-solid fa-book-open-reader mr-2"></i>{title}</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                    {terms.map(([term, def], i) => (
                        <div key={i} className="bg-slate-900/70 p-3 rounded-lg border border-slate-700/60">
                            <span className="text-cyan-300 font-bold">{term}</span>
                            <span className="text-slate-500"> — </span>
                            <span className="text-slate-300">{def}</span>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- Inline Term Tooltip (i) ---
        let termPopupState = null;
        const termPopupListeners = [];
        const showTermPopup = (word, def, x, y) => { termPopupState = { word, def, x, y }; termPopupListeners.forEach(f => f(termPopupState)); };
        const hideTermPopup = () => { termPopupState = null; termPopupListeners.forEach(f => f(null)); };

        const Term = ({ word, def, children }) => (
            <span
                className="cursor-help border-b border-dotted border-cyan-400/70 text-cyan-300"
                onClick={(e) => { e.stopPropagation(); showTermPopup(word, def, e.clientX, e.clientY); }}
            >
                {children || word}
                <i className="fa-solid fa-circle-info text-[10px] ml-0.5 text-cyan-500/80"></i>
            </span>
        );

        const TermPopover = () => {
            const [pop, setPop] = useState(null);
            useEffect(() => {
                const f = (p) => setPop(p);
                termPopupListeners.push(f);
                return () => { const i = termPopupListeners.indexOf(f); if (i >= 0) termPopupListeners.splice(i, 1); };
            }, []);
            useEffect(() => {
                if (!pop) return;
                const close = () => hideTermPopup();
                window.addEventListener('click', close);
                window.addEventListener('scroll', close, true);
                return () => { window.removeEventListener('click', close); window.removeEventListener('scroll', close, true); };
            }, [pop]);
            if (!pop) return null;
            const w = 300;
            const x = Math.min(Math.max(pop.x + 14, 8), window.innerWidth - w - 8);
            const y = Math.min(pop.y + 12, window.innerHeight - 140);
            return (
                <div className="fixed z-50 rounded-lg border border-cyan-500/50 bg-slate-800/95 shadow-2xl p-4 backdrop-blur" style={{ left: x, top: y, width: w }}>
                    <div className="text-cyan-300 font-bold text-sm mb-1.5 flex items-center"><i className="fa-solid fa-circle-info mr-2"></i>{pop.word}</div>
                    <p className="text-slate-300 text-xs leading-relaxed">{pop.def}</p>
                    <p className="text-slate-500 text-[10px] mt-2">คลิกที่ใดก็ได้เพื่อปิด</p>
                </div>
            );
        };

        // --- Content Data ---
        const contentData = {
            intro: (
                <div className="space-y-6">
                    <h2 className="text-3xl font-black text-blue-400 border-b border-slate-700 pb-2">1. Intro to OS</h2>
                    <p className="text-slate-300"><Term word="OS" def="โปรแกรมใหญ่ที่คอยดูแลเครื่องทั้งเครื่อง ทำหน้าที่แบ่ง CPU และหน่วยความจำให้ทุกโปรแกรมใช้ร่วมกันอย่างเป็นธรรม">Operating System (OS)</Term> คือซอฟต์แวร์ที่ทำหน้าที่เป็น "ผู้จัดการทรัพยากร (Resource Allocator)" ของคอมพิวเตอร์ ควบคุมทั้ง Hardware และ Software ให้ทำงานร่วมกันได้อย่างราบรื่น</p>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-gears mr-2 text-blue-400"></i> OS มองจาก 2 มุม</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-slate-300">
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <strong className="text-emerald-300 block mb-1">มุมผู้ใช้ (User View)</strong>
                                ผู้ใช้มอง OS เป็นเครื่องมือที่ทำให้ใช้คอมพิวเตอร์ได้<u>ง่าย สะดวก ปลอดภัย</u> ไม่ต้องยุ่งกับรายละเอียดฮาร์ดแวร์
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <strong className="text-blue-300 block mb-1">มุมระบบ (System View)</strong>
                                OS เป็น <strong>Resource Allocator</strong> — แบ่งปัน CPU, Memory, I/O ให้ทุกโปรแกรมอย่างเป็นธรรมและมีประสิทธิภาพ อีกบทบาทคือ <strong>Control Program</strong> คอยควบคุมไม่ให้โปรแกรมทำงานผิดพลาดหรือละเมิดกัน
                            </div>
                        </div>
                        <p className="mt-3 text-sm text-slate-300">เป้าหมายหลักของ OS: <span className="text-blue-300">สะดวกใช้ (Convenience)</span> + <span className="text-blue-300">ใช้ทรัพยากรคุ้ม (Efficiency)</span> + รองรับวิวัฒนาการฮาร์ดแวร์ได้</p>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-emerald-400 mb-3"><i className="fa-solid fa-shield-halved mr-2"></i> Dual Mode Operation</h3>
                        <p className="text-sm text-slate-300 mb-2">เพื่อป้องกันไม่ให้โปรแกรมของผู้ใช้ (User Program) ทำงานผิดพลาดจนระบบพัง OS จะทำงานร่วมกับ Hardware โดยแบ่งโหมดการทำงานออกเป็น 2 โหมด (ควบคุมผ่าน Mode Bit):</p>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-300">
                            <li><Term word="Kernel Mode" def="โหมดของระบบ มีสิทธิทำได้ทุกอย่าง (Mode bit = 0)"><strong className="text-white">Kernel Mode (Mode bit = 0):</strong></Term> โหมดผู้ดูแลระบบ สามารถรัน<Term word="Privileged Instructions" def="คำสั่งอันตรายที่เฉพาะระบบเท่านั้นใช้ได้ เช่น สั่งการฮาร์ดแวร์โดยตรง">คำสั่งอันตราย (Privileged Instructions)</Term> ได้ทุกอย่าง เช่น การเข้าถึง Hardware โดยตรง การแก้ Timer</li>
                            <li><Term word="User Mode" def="โหมดของโปรแกรมทั่วไป ถูกจำกัดสิทธิ ต้องขอให้ OS ทำแทน (Mode bit = 1)"><strong className="text-white">User Mode (Mode bit = 1):</strong></Term> โหมดผู้ใช้งานทั่วไป โปรแกรมปกติจะรันในโหมดนี้ หากต้องการใช้งาน Hardware ต้องร้องขอ OS ให้ทำแทน</li>
                        </ul>
                        <p className="mt-2 text-sm text-slate-400"><span className="text-yellow-300">จดจำ:</span> คำสั่ง Privileged ใช้ได้<u>เฉพาะใน Kernel Mode</u> ถ้าโปรแกรม User พยายามรันจะถูก Hardware ปัดตกทันที</p>
                        <Diagram title="การสลับโหมดผ่าน System Call (Trap)" w={680} h={170}>
                            <rect x={20} y={20} width={300} height={130} rx={10} fill="#0f172a" stroke="#334155" strokeDasharray="6,4" />
                            <text x={170} y={42} textAnchor="middle" fill="#64748b" fontSize="11">User Mode (Mode bit = 1)</text>
                            <rect x={360} y={20} width={300} height={130} rx={10} fill="#0f172a" stroke="#334155" strokeDasharray="6,4" />
                            <text x={510} y={42} textAnchor="middle" fill="#64748b" fontSize="11">Kernel Mode (Mode bit = 0)</text>
                            <DBox x={60} y={70} w={150} h={60} title="โปรแกรมผู้ใช้" sub="รันปกติใน User Mode" stroke="#60a5fa" />
                            <DBox x={470} y={70} w={150} h={60} title="Kernel (OS)" sub="ทำคำสั่งแทนให้" stroke="#4ade80" />
                            <DArrow x1={210} y1={90} x2={460} y2={90} label="System Call → Trap (สลับ mode)" color="#eab308" labelColor="#eab308" />
                            <DArrow x1={460} y1={120} x2={215} y2={120} label="คืนผลลัพธ์กลับ User Mode" color="#94a3b8" />
                        </Diagram>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-yellow-400 mb-3"><i className="fa-solid fa-bolt mr-2"></i> Interrupts (การขัดจังหวะ)</h3>
                        <p className="text-sm text-slate-300 mb-3">การประสานงานหลักระหว่าง OS และ Hardware เมื่ออุปกรณ์ (เช่น Disk) ทำงานเสร็จ จะ<Term word="Interrupt" def="สัญญาณจากฮาร์ดแวร์ให้ CPU หยุดงานที่ทำอยู่ก่อน แล้วหันไปจัดการเรื่องใหม่">ส่งสัญญาณ Interrupt</Term> ไปยัง CPU เพื่อให้ CPU หยุดงานปัจจุบัน แล้วหันมาเรียกใช้<Term word="ISR" def="โปรแกรมสั้น ๆ ที่เตรียมไว้รับมือสัญญาณ interrupt แต่ละชนิด เหมือนพนักงานเฉพาะทางรอรับสาย">โปรแกรมจัดการ (Interrupt Service Routine - ISR)</Term> ทันที</p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-slate-300 mb-3">
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Hardware Interrupt" def="สัญญาณขัดจังหวะที่มาจากอุปกรณ์ภายนอก เช่น คีย์บอร์ด ดิสก์"><strong className="text-yellow-300 block mb-1">Hardware Interrupt</strong></Term>
                                เกิดจากอุปกรณ์ภายนอกส่งสัญญาณมา (กดคีย์บอร์ด, Disk อ่านเสร็จ, Mouse เลื่อน) เกิดแบบ "ไม่บอกล่วงหน้า"
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Trap" def="การที่โปรแกรมจงใจเรียกให้ CPU เข้าโหมด Kernel เพื่อขอใช้บริการ OS"><strong className="text-purple-300 block mb-1">Software Interrupt (Trap)</strong></Term>
                                เกิดจากโปรแกรมจงใจเรียก เช่น System Call หรือเกิด Exception (หารด้วย 0, ใช้ Memory ผิด)
                            </div>
                        </div>
                        <h4 className="text-white font-bold text-sm mb-2">ลำดับการจัดการ Interrupt (มี 4 ขั้น):</h4>
                        <ol className="list-decimal ml-6 space-y-1 text-sm text-slate-300 mb-3">
                            <li>CPU กำลังรันงาน → ได้รับสัญญาณ Interrupt → บันทึก State ปัจจุบัน (PC, Registers) ไว้ก่อน</li>
                            <li>CPU <Term word="Interrupt Vector Table" def="ตารางที่เก็บที่อยู่ของโปรแกรมจัดการ interrupt แต่ละเบอร์ไว้">เปิดดู <strong>Interrupt Vector Table</strong></Term> เพื่อรู้ที่อยู่ของ ISR ที่ตรงกับเบอร์ Interrupt นั้น</li>
                            <li>กระโดดไปรัน ISR ใน Kernel Mode</li>
                            <li>รันเสร็จ → Restore State เดิม → กลับไปทำงานต่อเหมือนไม่มีอะไรเกิดขึ้น</li>
                        </ol>
                        <Diagram title="เส้นทางการขัดจังหวะ (Interrupt Flow)" w={680} h={150}>
                            <DBox x={20} y={70} w={150} h={55} title="อุปกรณ์ I/O" sub="ทำงานเสร็จ / เกิดเหตุการณ์" stroke="#4ade80" />
                            <DBox x={270} y={70} w={140} h={55} title="CPU" sub="หยุดงานปัจจุบัน" stroke="#60a5fa" />
                            <DBox x={510} y={70} w={150} h={55} title="ISR ใน Kernel" sub="จัดการเสร็จ → กลับไปต่อ" stroke="#eab308" />
                            <DArrow x1={170} y1={97} x2={265} y2={97} label="ส่ง Interrupt" color="#4ade80" labelColor="#4ade80" />
                            <DArrow x1={410} y1={97} x2={505} y2={97} label="Vector Table" color="#eab308" labelColor="#eab308" />
                        </Diagram>
                    </div>
                    <Glossary terms={[

            boot: (

                    <h2 className="text-3xl font-black text-blue-400 border-b border-slate-700 pb-2">1.2 ขั้นตอนการบูตเครื่อง (Booting)</h2>
                    <p className="text-slate-300">การบูตเครื่องคือลำดับขั้นที่พาเครื่องจาก "ไฟดับ" ไปจนถึงจุดที่ OS พร้อมใช้งาน โดยมีตัวละครหลักคือ <Term word="Bootstrap Program" def="โปรแกรมแรกที่ถูกเรียกตอนเปิดเครื่อง ฝังอยู่ใน ROM หน้าที่คือตามหา OS"><strong>Bootstrap Program</strong></Term> ที่ถูกฝังไว้ใน <Term word="Firmware" def="โปรแกรมที่ฝังติดเครื่องมาตั้งแต่โรงงาน อยู่ในชิป ROM ไม่หายแม้ปิดเครื่อง"><u>Firmware (ROM/EEPROM)</u></Term> ไม่ใช่บนดิสก์!</p>

                        <ol className="list-decimal ml-6 space-y-2 text-sm text-slate-300">
                            <li><strong>เปิดเครื่อง (Power On):</strong> CPU ถูกสั่งให้เริ่มรันโค้ด ณ Address พิเศษใน Firmware</li>

                            <li><Term word="Bootstrap Loader" def="โปรแกรมที่อ่าน Boot Sector เพื่อโหลด OS ขึ้นมา"><strong>Bootstrap Loader:</strong></Term> Firmware <Term word="Boot Sector" def="พื้นที่เล็ก ๆ บนดิสก์ที่เก็บตัวโหลด OS เหมือนป้ายบอกทาง">ค้นหา Boot Sector</Term> (MBR/Boot Partition) เพื่อหา Bootloader (เช่น GRUB)</li>
                            <li><strong>โหลด Kernel:</strong> Bootloader นำ Kernel เข้า Memory และส่งต่อการควบคุมให้</li>
                            <li><strong>Kernel Init:</strong> Kernel เริ่มบริการต่าง ๆ แล้วรันโปรแกรมแรก <code className="text-yellow-300">init</code> / <code className="text-yellow-300">systemd</code> <Term word="PID" def="เลขบัตรประชาชนของแต่ละ Process ที่กำลังรัน">(PID 1)</Term></li>
                            <li><strong>พร้อมใช้งาน:</strong> ระบบเปิดบริการเข้าสู่ Login / Desktop</li>
                        </ol>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">

                            <li><Term word="UEFI" def="ระบบเฟิร์มแวร์รุ่นใหม่ ใช้เมาส์ได้ บูตไว มี Secure Boot"><strong className="text-white">UEFI:</strong></Term> รุ่นใหม่ รองรับพาร์ติชัน GPT, <Term word="Secure Boot" def="ระบบตรวจลายเซ็นของ OS ก่อนยอมบูต เพื่อกันมัลแวร์">Secure Boot</Term> (ตรวจ Signature ก่อนบูต), บูตเร็วขึ้น ใช้ GUI</li>
                        </ul>
                        <p className="mt-3 text-yellow-300 text-sm"><i className="fa-solid fa-lightbulb"></i> ทริคสอบ: ข้อสอบชอบถามว่า Bootstrap Program อยู่ที่ไหน → คำตอบคือ Firmware (ROM) ไม่ใช่ Hard Disk</p>
                    </div>
                    <Glossary terms={[
                        ['ROM / EEPROM', 'หน่วยความจำแบบอ่านอย่างเดียว (แก้ยาก) ใช้เก็บโปรแกรมบูตเครื่องไว้ถาวร ไฟดับก็ไม่หาย'],
                        ['POST', 'ขั้นตอนที่เครื่อง "ตรวจสุขภาพ" ฮาร์ดแวร์ตัวเองตอนเปิดเครื่อง เช่น เช็คว่ามี RAM กี่ GB'],

                        ['BIOS', 'ระบบเฟิร์มแวร์รุ่นเก่า ทำงานแบบ text ล้วน ๆ มีข้อจำกัดหลายอย่าง'],

            structure: (
                <div className="space-y-6">

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-code mr-2 text-blue-400"></i> System Call (ประตูสู่ OS)</h3>
                        <p className="text-sm text-slate-300 mb-3">เมื่อโปรแกรมใน User Mode ต้องการใช้ทรัพยากร (เช่น อ่านไฟล์, สร้าง Process) จะ<Term word="System Call" def="ช่องทางเดียวที่โปรแกรมใช้ร้องขอให้ OS ทำอะไรให้ เหมือนเคาน์เตอร์บริการด่วน">ต้องทำผ่าน <strong>System Call</strong></Term> ซึ่งจะเป็นการ Trigger ให้เกิด <Term word="Trap" def="การที่โปรแกรมจงใจเรียกให้ CPU เข้าโหมด Kernel เพื่อขอใช้บริการ OS">Software Interrupt (Trap)</Term> เพื่อเปลี่ยนจาก User Mode ไปเป็น Kernel Mode</p>
                        <ul className="list-disc ml-6 space-y-1 text-sm text-slate-300">
                            <li>เรามักไม่เรียก System Call ตรงๆ แต่<Term word="API" def="คนกลางที่ช่วยให้โปรแกรมเมอร์เรียกใช้ OS ได้ง่าย ๆ โดยไม่ต้องรู้กลไกข้างใน">เรียกผ่าน <strong>API</strong></Term> (Application Programming Interface)</li>
                            <li>ตัวอย่าง API: <Term word="POSIX" def="มาตรฐานคำสั่งของระบบตระกูล Unix/Linux"><span className="text-blue-300">POSIX API</span></Term> (สำหรับ Linux/Unix), <Term word="Win32" def="ชุด API มาตรฐานของ Windows"><span className="text-blue-300">Win32 API</span></Term> (สำหรับ Windows)</li>
                        </ul>
                        <h4 className="text-white font-bold text-sm mt-4 mb-2">เบื้องหลังการเรียก System Call (5 ขั้นตอน):</h4>
                        <ol className="list-decimal ml-6 space-y-1 text-sm text-slate-300">
                            <li>โปรแกรมเรียกฟังก์ชัน API (เช่น <code className="text-yellow-300">printf</code> ภายในไปเรียก <code className="text-yellow-300">write()</code>)</li>
                            <li>API ใส่ "เบอร์ของ System Call" และ parameters <Term word="Register" def="ที่เก็บข้อมูลจิ๋วความเร็วสูงสุดภายใน CPU ใช้ส่งค่าให้ System Call">ลงใน Register</Term> (หรือ Stack)</li>
                            <li>เรียกคำสั่ง Trap → CPU เปลี่ยน Mode Bit เป็น 0 (เข้า Kernel Mode)</li>
                            <li>Kernel เปิดตาราง System Call Table หา Handler ที่ตรงกับเบอร์ → รันบริการนั้นให้</li>
                            <li>คืนผลลัพธ์กลับโปรแกรม พร้อมสลับกลับ User Mode</li>
                        </ol>

                        <ul className="list-disc ml-6 space-y-1 text-sm text-slate-300">
                            <li><strong className="text-white">Process Control:</strong> สร้าง/จบ/รอ process เช่น <code className="text-yellow-300">fork(), exec(), wait(), exit()</code></li>

                            <li><strong className="text-white">Information Maintenance:</strong> ดูเวลา ดูข้อมูลระบบ เช่น <code className="text-yellow-300">getpid(), time()</code></li>
                            <li><strong className="text-white">Communication:</strong> ส่งข้อความระหว่าง process เช่น <code className="text-yellow-300">pipe(), shmget(), socket()</code></li>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-sitemap mr-2 text-purple-400"></i> สถาปัตยกรรมของ Kernel</h3>

                                โครงสร้างแบบดั้งเดิม เอาทุกบริการ (Memory, I/O, File System) ยัดรวมไว้ใน Kernel เดียวกัน 
                                <br/><span className="text-green-400">ข้อดี:</span> ทำงานเร็วมาก เพราะไม่ต้องเปลี่ยนโหมดไปมา
                                <br/><span className="text-red-400">ข้อเสีย:</span> โค้ดซับซ้อน ถ้าพังจุดนึง ระบบอาจล่มทั้งหมด
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Microkernel" def="แนวคิดแยกบริการออกไป User Space เหลือแค่ส่งข้อความ — ปลอดภัยแต่ช้ากว่า"><strong className="text-white block mb-1">Microkernel</strong></Term>

                                <br/><span className="text-red-400">ข้อเสีย:</span> ช้ากว่า เพราะต้องส่งข้อความข้ามโหมดบ่อยครั้ง

                            <DArrow x1={550} y1={135} x2={520} y2={170} label="Msg" color="#eab308" labelColor="#eab308" />
                        </Diagram>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-layer-group mr-2 text-cyan-400"></i> โครงสร้างแบบอื่น ๆ ที่ควรรู้จัก</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-300">

                        ['Register', 'ที่เก็บข้อมูลจิ๋วความเร็วสูงสุดที่อยู่ภายใน CPU ใช้ส่งค่าต่าง ๆ ให้ System Call'],

            ostypes: (
                <div className="space-y-6">
                    <h2 className="text-3xl font-black text-blue-400 border-b border-slate-700 pb-2">2.2 ประเภทของ OS</h2>
                    <p className="text-slate-300">OS แบ่งได้หลายมิติ ข้อสอบชอบถามทั้ง <strong>ตามวิธีการป้อนข้อมูล</strong> และ <strong>ตามจำนวนผู้ใช้/งานที่รันพร้อมกัน</strong></p>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-keyboard mr-2 text-blue-400"></i> แบ่งตามวิธีการป้อนข้อมูล</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-slate-300">
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Batch OS" def="รวบงานเป็นกอง ๆ แล้วรันเรียงไปทีละกอง ไม่มีคนนั่งคุยกับเครื่อง"><strong className="text-yellow-300 block mb-1">Batch OS</strong></Term>
                                รวบรวมงานเป็น "กอง" (Batch) แล้วประมวลผลทีละกอง ผู้ใช้ไม่ interact ระหว่างรัน
                                <br/><Term word="Throughput" def="ปริมาณงานที่เสร็จต่อช่วงเวลา ยิ่งมากยิ่งดี"><span className="text-green-400">ข้อดี:</span> Throughput</Term> สูง ใช้ CPU คุ้ม
                                <br/><span className="text-red-400">ข้อเสีย:</span> ไม่ตอบสนองทันที (เช่น ระบบเงินเดือนบริษัท)
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Time-sharing" def="แบ่งเวลา CPU สลับกันเร็วมากจนผู้ใช้หลายคนรู้สึกเหมือนใช้เครื่องอยู่คนเดียว"><strong className="text-emerald-300 block mb-1">Interactive (Time-sharing)</strong></Term>
                                ผู้ใช้ interact กับระบบได้ OS สลับแบ่งเวลา CPU ให้ผู้ใช้หลายคนหมุนเวียนกันเร็ว ๆ จนรู้สึกว่า "ใช้อยู่คนเดียว"
                                <br/><span className="text-green-400">ข้อดี:</span> Response time ดี
                                <br/><span className="text-red-400">ข้อเสีย:</span> Overhead จากการสลับงานสูง
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Real-time OS" def="ระบบที่งานมีเส้นตาย ต้องเสร็จตรงเวลา ผิดนัดคือล้มเหลว"><strong className="text-red-300 block mb-1">Real-time OS</strong></Term>
                                งานต้องเสร็จภายใน Deadline ที่กำหนดเด็ดขาด
                                <br/><span className="text-white">Hard RT:</span> พลาด deadline = ระบบล้มเหลว (ระบบเบรก, เครื่องบิน)
                                <br/><span className="text-white">Soft RT:</span> พลาดได้บ้าง ขอแค่ส่วนใหญ่ทัน (มัลติมีเดีย)
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">

            processmgmt: (
                <div className="space-y-6">
                    <h2 className="text-3xl font-black text-blue-400 border-b border-slate-700 pb-2">4. การจัดการ Process: fork(), exec(), exit(), wait()</h2>
                    <p className="text-slate-300">บทนี้คือ <strong className="text-yellow-300">จุดชี้เป็นชี้ตายของข้อสอบ</strong> — อาจารย์เน้นให้ไล่โค้ดดูการทำงานทีละบรรทัด มีจุดหลอกเยอะ!</p>

                    <div className="bg-slate-800 p-5 rounded-xl border border-blue-900/50">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-eye mr-2 text-blue-400"></i> ภาพรวมทั้งชีวิตของ Process ในรูปเดียว</h3>
                        <Diagram title="fork() → exec() → exit() → wait() พร้อม PID" w={720} h={380}>
                            <DCode x={20} y={25} w={280} h={105} title="Parent — PID 100" stroke="#60a5fa"
                                code={"pid_t pid = fork();\nif (pid > 0) {\n  wait(NULL);  // pid = 101\n}"} />
                            <DCode x={420} y={25} w={280} h={105} title="Child — PID 101" stroke="#4ade80" titleColor="#86efac"
                                code={"if (pid == 0) {\n  execlp(\"/bin/ls\", \"ls\", NULL);\n  exit(0);\n}"} />
                            <DArrow x1={302} y1={70} x2={415} y2={70} color="#60a5fa" />

                            <DArrow x1={560} y1={132} x2={560} y2={165} color="#a78bfa" />
                            <text x={616} y={150} textAnchor="middle" fill="#a78bfa" fontSize="10">exec() แทนที่โปรแกรม</text>
                            <DBox x={420} y={280} w={280} h={65} title="Zombie (PID 101)" sub={["exit() แล้ว PCB ค้างรอแม่"]} stroke="#f87171" />
                            <DArrow x1={560} y1={238} x2={560} y2={275} color="#f87171" />
                            <text x={596} y={260} textAnchor="middle" fill="#f87171" fontSize="10">exit()</text>
                            <DArrow x1={250} y1={200} x2={425} y2={290} dashed={true} color="#eab308" />
                            <text x={258} y={242} textAnchor="middle" fill="#eab308" fontSize="10">wait() เก็บสถานะ</text>
                            <text x={258} y={256} textAnchor="middle" fill="#eab308" fontSize="10">→ กำจัด Zombie</text>
                            <DBox x={60} y={170} w={190} h={60} title="Parent รันต่อ" sub={["wait() คืน PID = 101"]} stroke="#60a5fa" />
                            <DArrow x1={155} y1={132} x2={155} y2={165} color="#60a5fa" />
                        </Diagram>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><Term word="fork()" def="คำสั่งก๊อปปี้ตัวเอง สร้าง Process ลูกที่เหมือนแม่ทุกอย่าง แต่แยกกันอยู่คนละโลก"><i className="fa-solid fa-code-branch mr-2 text-blue-400"></i> fork()</Term> — สร้างลูก</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-300">
                            <li>สร้าง Process ใหม่ (Child) ที่เป็น <strong>Copy ของ Parent</strong> ทั้ง Code, Data, Heap, Stack</li>
                            <li><strong className="text-emerald-400">ค่าที่คืนกลับ (ต้องจำ!):</strong> Parent ได้ PID ของลูก (&gt; 0), Child ได้ 0, Error ได้ -1</li>
                            <li>หลัง fork() ทั้งแม่และลูกจะรันโค้ดบรรทัดถัดไป <u>พร้อมกัน</u> — ลำดับการรันขึ้นกับ Scheduler (ไม่แน่นอน!)</li>
                            <li>Memory แยกกันเด็ดขาด: ลูกแก้ตัวแปร ไม่กระทบแม่ (จริง ๆ ใช้เทคนิค Copy-on-Write เพื่อประหยัด)</li>
                            <li>จำนวน process หลัง fork() n ครั้ง = 2<sup>n</sup> ตัว (กับดักยอดฮิต! ไม่ใช่ n+1)</li>
                        </ul>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-wand-magic-sparkles mr-2 text-purple-400"></i> exec() — แปลงร่าง</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-300">
                            <li><strong>ไม่สร้าง Process ใหม่!</strong> แต่แทนที่ Memory Image ของ Process ปัจจุบันด้วยโปรแกรมใหม่ทั้งหมด (PID เดิม)</li>
                            <li><Term word="exec()" def="คำสั่งแปลงร่าง เปลี่ยนโปรแกรมของ Process นี้เป็นโปรแกรมอื่นทันที (PID เดิม)">ตระกูล exec:</Term> <code className="text-yellow-300">execlp</code>, <code className="text-yellow-300">execvp</code>, <code className="text-yellow-300">execv</code>, <code className="text-yellow-300">execle</code> — ต่างกันที่วิธีส่ง argument (list vs array) และการระบุ path</li>
                            <li><span className="text-red-400">จุดหลอก:</span> ถ้า exec() สำเร็จ โค้ดทุกบรรทัดที่อยู่หลัง exec() ใน process นั้นจะ<u>ไม่ถูกรันเลย</u> (โปรแกรมถูกแทนที่ไปแล้ว)</li>
                            <li>คืนค่า -1 ก็ต่อเมื่อ exec ล้มเหลวเท่านั้น</li>
                        </ul>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><Term word="exit()" def="คำสั่งจบชีวิตของ Process พร้อมส่งใบแจ้งตาย (status) ให้แม่รับทราบ"><i className="fa-solid fa-door-open mr-2 text-red-400"></i> exit()</Term> vs _exit()</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-slate-300">
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <strong className="text-red-300 block mb-1">exit(status)</strong>
                                จบ process แบบ "สุภาพ" — <Term word="Buffer" def="ที่พักข้อมูลชั่วคราวก่อนปล่อยออกจอ/ไฟล์ exit() ล้างให้ แต่ _exit() ไม่ล้าง">เคลียร์ Buffer</Term> ทั้งหมด (stdout), ปิดไฟล์, คืนสถานะให้ Parent ทาง wait()
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <strong className="text-orange-300 block mb-1">_exit(status)</strong>
                                จบแบบ "ทันที" — ไม่เคลียร์ Buffer! ข้อความที่ค้างใน stdout buffer อาจหายไปไม่ถูกพิมพ์
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><Term word="wait()" def="แม่ยืนรอจนกว่าลูกจะทำงานเสร็จ แล้วรับใบแจ้งตายของลูก"><i className="fa-solid fa-handshake mr-2 text-emerald-400"></i> wait()</Term> & waitpid()</h3>
                        <ul className="list-disc ml-6 space-y-2 text-sm text-slate-300">
                            <li><strong className="text-white">wait(NULL):</strong> Parent "หยุดรอ" (Block) จนกว่า Child <u>ตัวใดก็ได้</u> จบ แล้วคืน PID ของ Child ที่จบ</li>
                            <li><strong className="text-white">waitpid(pid, &amp;status, options):</strong> ระบุได้ว่ารอ Child ตัวไหน ใช้ option <code className="text-yellow-300">WNOHANG</code> เพื่อ "เช็คโดยไม่รอ" (ถ้ายังไม่จบ คืน 0 ทันที)</li>
                            <li>ถ้า Parent เรียก wait() ทั้งที่ไม่มี Child อยู่เลย → คืน -1 ทันที</li>
                        </ul>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-red-900/50">
                        <h3 className="text-xl font-bold text-red-400 mb-3"><i className="fa-solid fa-skull mr-2"></i> Zombie & Orphan (ออกสอบแน่นอน!)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-slate-300">

                                ลูกจบแล้ว (เรียก exit) แต่<u>แม่ยังไม่เรียก wait()</u> → <Term word="PCB" def="ไฟล์ประวัติส่วนตัวของแต่ละ Process ที่ OS จดไว้">OS ยังเก็บ PCB</Term> (<Term word="PID" def="เลขบัตรประชาชนของแต่ละ Process">PID</Term>, exit status) ค้างไว้รอแม่มารับ
                                <br/><span className="text-yellow-300">วิธีแก้: แม่ต้องเรียก wait()</span>
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-700">
                                <Term word="Orphan" def="ลูกกำพร้าที่แม่ตายก่อน ระบบส่ง init (PID 1) มารับเลี้ยงแทน"><strong className="text-purple-300 block mb-1">Orphan Process</strong></Term>
                                แม่ตายก่อนลูก → ลูกถูกฝากให้ <strong>init / systemd (PID 1)</strong> รับเลี้ยง ซึ่ง init จะเรียก wait() ให้อัตโนมัติ ลูกจึงไม่ค้างเป็น Zombie
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 text-sm text-slate-300">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-circle-stop mr-2 text-orange-400"></i> Process จบการทำงานด้วยวิธีใดได้บ้าง</h3>
                        <ul className="list-disc ml-6 space-y-1">
                            <li>เรียก <code className="text-yellow-300">exit()</code> หรือ <code className="text-yellow-300">_exit()</code></li>
                            <li><code className="text-yellow-300">return</code> จาก main() (เทียบเท่า exit)</li>
                            <li>ถูก signal ฆ่า (เช่น SIGKILL, SIGTERM)</li>
                            <li>เกิด error/abort จนถูกบังคับจบ</li>
                        </ul>
                    </div>
                    <Glossary terms={[
                        ['PID', 'เลขประจำตัวของ Process เหมือนเลขบัตรประชาชน ใช้เรียกหา Process นั้น ๆ'],
                        ['Parent / Child', 'แม่คือ Process ที่เรียก fork() สร้างใครขึ้นมา ส่วนลูกคือ Process ที่ถูกสร้างใหม่'],
                        ['fork()', 'คำสั่ง "ก๊อปปี้ตัวเอง" — สร้าง Process ลูกที่เหมือนแม่ทุกอย่าง แต่แยกกันอยู่คนละโลก'],
                        ['exec()', 'คำสั่ง "แปลงร่าง" — เปลี่ยนโปรแกรมของ Process นี้เป็นโปรแกรมอื่นทันที (PID เดิม)'],
                        ['exit()', 'คำสั่ง "จบชีวิต" ของ Process พร้อมส่งใบแจ้งตาย (status) ให้แม่รับทราบ'],
                        ['wait()', 'แม่ "ยืนรอ" หน้าประตูจนกว่าลูกจะทำงานเสร็จ แล้วรับใบแจ้งตายของลูก'],
                        ['Zombie', 'วิญญาณค้าง — ลูกตายแล้วแต่แม่ยังไม่มารับรู้ ใบตาย (PCB) ค้างอยู่ในระบบ'],
                        ['Orphan', 'ลูกกำพร้า — แม่ตายก่อนลูก ระบบจะส่ง init (PID 1) มารับเลี้ยงแทน'],

            thread: (
                <div className="space-y-6">
                    <h2 className="text-3xl font-black text-blue-400 border-b border-slate-700 pb-2">5. Intro to Thread</h2>
                    <p className="text-slate-300"><Term word="Thread" def="คนงานย่อยภายใน Process หลายคนช่วยกันทำงาน ใช้ทรัพยากรร่วมกัน"><strong>Thread (เธรด)</strong></Term> หรือ Lightweight Process เป็นหน่วยย่อยของการประมวลผลที่อยู่ภายใน Process จุดประสงค์คือเพื่อให้โปรแกรมสามารถทำงานขนานกันได้ (Concurrency) โดยใช้ทรัพยากรสิ้นเปลืองน้อยกว่าการแตก Process ใหม่</p>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col md:flex-row gap-4">
                        <div className="md:w-1/2">
                            <h3 className="font-bold text-green-400 mb-2">สิ่งที่ Thread <u>แชร์ร่วมกัน</u> (Shared)</h3>

                                <li>Code Section (ชุดคำสั่ง)</li>

                            </ul>
                        </div>
                        <div className="md:w-1/2">
                            <h3 className="font-bold text-red-400 mb-2">สิ่งที่ Thread <u>แยกกันเป็นของตัวเอง</u></h3>
                            <ul className="list-disc ml-6 text-sm text-slate-300 space-y-1">
                                <li>Thread ID</li>

                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-share-nodes mr-2 text-blue-400"></i> ภาพ: Thread แชร์อะไร? เก็บอะไรไว้กับตัว?</h3>
                        <Diagram title="โครงสร้าง Process ที่มีหลาย Thread" w={680} h={280}>
                            <rect x={25} y={15} width={630} height={250} rx={12} fill="#0f172a" stroke="#3b82f6" strokeWidth={1.5} />
                            <text x={45} y={38} fill="#60a5fa" fontSize="12" fontWeight="bold">Process</text>
                            <rect x={50} y={55} width={270} height={190} rx={8} fill="#1e293b" stroke="#4ade80" />
                            <text x={185} y={78} textAnchor="middle" fill="#4ade80" fontSize="11" fontWeight="bold">สิ่งที่ทุก Thread แชร์กัน</text>
                            <DBox x={70} y={92} w={230} h={40} title="Code (Text Section)" sub="" stroke="#64748b" titleSize={11} />
                            <DBox x={70} y={140} w={230} h={40} title="Data (Global Variables)" sub="" stroke="#64748b" titleSize={11} />
                            <DBox x={70} y={188} w={230} h={40} title="OS Resources (ไฟล์ที่เปิด)" sub="" stroke="#64748b" titleSize={11} />
                            <DBox x={380} y={62} w={250} h={48} title="Thread 1" sub="PC, Registers, Stack ส่วนตัว" stroke="#a78bfa" />
                            <DBox x={380} y={122} w={250} h={48} title="Thread 2" sub="PC, Registers, Stack ส่วนตัว" stroke="#a78bfa" />
                            <DBox x={380} y={182} w={250} h={48} title="Thread 3" sub="PC, Registers, Stack ส่วนตัว" stroke="#a78bfa" />
                            <DArrow x1={322} y1={110} x2={375} y2={86} dashed={true} color="#94a3b8" />
                            <DArrow x1={322} y1={158} x2={375} y2={146} dashed={true} color="#94a3b8" />
                            <DArrow x1={322} y1={208} x2={375} y2={206} dashed={true} color="#94a3b8" />
                        </Diagram>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 text-sm text-slate-300">
                        <h3 className="text-xl font-bold text-white mb-3">Multithreading Models</h3>
                        <ul className="space-y-2">
                            <li><Term word="ULT" def="Thread ที่ OS ไม่รู้จัก จัดการกันเองระดับโปรแกรม บล็อกตัวเดียวตายยกทีม"><strong className="text-blue-300">User-Level Thread (ULT):</strong></Term> จัดการโดย Library ระดับผู้ใช้ (เช่น Pthreads, Java Threads) OS ไม่รู้จัก Thread เหล่านี้ <u>ข้อเสีย:</u> ถ้า Thread นึงบล็อก (เช่น รอ I/O) จะพา Thread อื่นใน Process เดียวกันบล็อกไปด้วยทั้งหมด</li>
                            <li><Term word="KLT" def="Thread ที่ OS รู้จักและจัดการให้ บล็อกตัวหนึ่ง ตัวอื่นยังรันได้"><strong className="text-purple-300">Kernel-Level Thread (KLT):</strong></Term> OS เป็นคนจัดการ <u>ข้อดี:</u> ถ้า Thread นึงบล็อก Thread อื่นก็ยังรันได้บน CPU Core อื่น แต่กิน Overhead มากกว่า</li>
                        </ul>

                <div className="space-y-6">
                    <h2 className="text-3xl font-black text-blue-400 border-b border-slate-700 pb-2">6. CPU Scheduling</h2>
                    <p className="text-slate-300">เมื่อมี Process อยู่ใน Ready Queue หลายตัว <Term word="Scheduler" def="ผู้จัดคิว ตัดสินใจว่า Process ไหนจะได้ใช้ CPU ก่อน"><strong>Short-term Scheduler</strong></Term> (<Term word="Dispatcher" def="ตัวส่งงาน หยิบ Process จากคิวส่งเข้า CPU จริง ๆ">Dispatcher)</Term> ต้องตัดสินใจว่าจะเลือกใครเข้าไปรันใน CPU</p>

                    <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                        <div className="bg-slate-800 p-4 rounded-xl border-l-4 border-red-500">
                            <Term word="Non-preemptive" def="แย่ง CPU คืนไม่ได้ — งานที่ได้ CPU จะรันจนเสร็จหรือยอมปล่อยเอง"><strong className="text-white block mb-1">Non-preemptive</strong></Term>
                            เมื่อ Process ได้ CPU แล้ว จะรันจนกว่าจะเสร็จ หรือยอมสละ CPU เอง OS แทรกแซงดึง CPU คืนไม่ได้
                        </div>
                        <div className="bg-slate-800 p-4 rounded-xl border-l-4 border-green-500">
                            <Term word="Preemptive" def="แย่ง CPU คืนได้ — OS เรียกงานออกจาก CPU กลางคันได้ทุกเมื่อ"><strong className="text-white block mb-1">Preemptive</strong></Term>
                            OS สามารถ "แย่ง (ขัดจังหวะ)" CPU คืนจาก Process ที่รันอยู่ได้ตามต้องการ (เช่น หมดเวลาโควต้า)

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-4">อัลกอริทึมยอดฮิต (เก็งข้อสอบ!)</h3>
                        <div className="space-y-4 text-sm text-slate-300">
                            <div>
                                <strong className="text-blue-300 text-base block">1. FCFS (First-Come, First-Served)</strong>
                                ใครมาก่อนได้ทำก่อน (Non-preemptive). <br/>
                                <span className="text-red-400">ปัญหา (Trap):</span> <b>Convoy Effect</b> หากงานใหญ่มาก่อน งานเล็กๆ ข้างหลังจะรอนานมาก (Waiting time เฉลี่ยสูง)
                            </div>
                            <div>
                                <strong className="text-blue-300 text-base block">2. SJF (Shortest Job First)</strong>
                                <Term word="Burst Time" def="เวลาที่งานต้องใช้ CPU จนเสร็จ ไม่รวมเวลารอ I/O">ใครใช้เวลาทำ (Burst time)</Term> น้อยสุด ได้ทำก่อน (Non-preemptive). ให้ Waiting time เฉลี่ยต่ำที่สุด!
                                <br/><span className="text-red-400">ปัญหา:</span> ในชีวิตจริง เราไม่รู้ล่วงหน้าว่า Process จะใช้เวลาเท่าไหร่
                            </div>
                            <div>
                                <strong className="text-blue-300 text-base block">3. Priority Scheduling</strong>
                                กำหนด "สิทธิ (Priority)" ใครสิทธิสูงกว่าได้ทำก่อน (เช่น Java Thread กำหนด 1-10)
                                <br/><span className="text-red-400">ปัญหา (Trap):</span> <Term word="Starvation" def="งานอดตาย — ถูกงานอื่นแซงคิวตลอด ไม่ได้รันสักที"><b>Starvation (อดตาย)</b></Term> Process ที่สิทธิต่ำมากๆ อาจไม่ถูกเรียกเลยตลอดกาล!
                                <br/><span className="text-green-400">ทางแก้:</span> <Term word="Aging" def="ค่อย ๆ เพิ่มสิทธิให้งานที่รอนาน ยิ่งรอยิ่งได้เปรียบ จนได้รัน"><b>Aging</b></Term> ค่อยๆ เพิ่มสิทธิให้ Process ที่รอนานๆ เมื่อเวลาผ่านไป
                            </div>
                            <div>
                                <strong className="text-blue-300 text-base block">4. Round Robin (RR)</strong>
                                จัดคิวแบบวนรอบ ทุกคนจะได้เวลาคนละนิด <Term word="Time Quantum" def="เวลา CPU ต่อรอบที่ Round Robin แบ่งให้แต่ละงาน">เรียกว่า <b>Time Quantum (q)</b></Term> (Preemptive). 
                                เหมาะกับระบบ Interactive ที่ต้องการ Response time ที่ดี
                                <br/><span className="text-yellow-400">จุดสังเกต:</span> ถ้า q มากไป จะกลายเป็น FCFS. ถ้า q น้อยไป Context Switch Overhead จะบานตะไท!
                            </div>
                            <div>
                                <strong className="text-blue-300 text-base block">5. SRTF (Shortest Remaining Time First)</strong>
                                เวอร์ชัน Preemptive ของ SJF — ทุกครั้งที่มี Process ใหม่มาถึง ระบบจะเทียบว่า "เวลาที่เหลือ (Remaining Time)" ของใครน้อยกว่า ถ้าน้องใหม่น้อยกว่าตัวที่รันอยู่ จะโดน <b>แย่ง CPU ทันที</b>
                                <br/><span className="text-green-400">ข้อดี:</span> Average Waiting Time ต่ำที่สุด

                            </div>

                                <br/><span className="text-red-400">ข้อจำกัด:</span> Process จะ<u>ติดอยู่ชั้นเดิมตลอดชีวิต</u> ย้ายชั้นไม่ได้
                            </div>
                            <div>

                                <br/><span className="text-green-400">ฉลาดกว่า MLQ:</span> ปรับตัวตามพฤติกรรมของงานได้
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700">
                        <h3 className="text-xl font-bold text-white mb-3"><i className="fa-solid fa-ruler mr-2 text-emerald-400"></i> เกณฑ์วัด Scheduling (จำสูตรให้ขึ้นใจ!)</h3>

                                    else if (idx === (q.ans ? 0 : 1)) cls += "border-emerald-500 bg-emerald-900/20 text-emerald-300";
                                    else if (idx === selected) cls += "border-red-500 bg-red-900/20 text-red-300";
                                    else cls += "border-slate-800 bg-slate-900/30 text-slate-600 opacity-50";
                                    return (
                                        <button key={idx} onClick={() => handleTf(idx)} disabled={showExp} className={cls}>
                                            {idx === 0 ? <i className="fa-solid fa-circle-check mr-2"></i> : <i className="fa-solid fa-circle-xmark mr-2"></i>} {opt}
                                        </button>
                                    );
                                })}
                            </div>
                            {!showExp && (
                                <button onClick={handleSkip} className="w-full p-3 rounded-lg border-2 border-dashed border-slate-600 text-slate-400 hover:bg-slate-900/50 transition text-sm font-medium">
                                    ข้ามข้อนี้ (ได้ 0 คะแนน ไม่ติดลบ)
                                </button>
                            )}
                        </div>
                    ) : (
                        <div className="space-y-3 mb-8">
                            <div className="flex gap-3">
                                <input
                                    type="text"
                                    value={fillInput}
                                    onChange={(e) => setFillInput(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === 'Enter') handleFill(); }}
                                    disabled={showExp}
                                    placeholder="พิมพ์คำตอบ..."
                                    className="flex-1 bg-slate-900 border-2 border-slate-700 focus:border-blue-500 rounded-lg px-4 py-3 text-white outline-none disabled:opacity-50 font-mono"
                                />
                                <button onClick={handleFill} disabled={showExp || !fillInput.trim()} className="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition disabled:opacity-50">
                                    ตรวจคำตอบ
                                </button>
                            </div>
                            {!showExp && (
                                <button onClick={handleSkip} className="w-full p-3 rounded-lg border-2 border-dashed border-slate-600 text-slate-400 hover:bg-slate-900/50 transition text-sm font-medium">
                                    ข้ามข้อนี้ (ได้ 0 คะแนน)
                                </button>
                            )}
                        </div>
                    )}

                    {showExp && (
                        <div className={`bg-slate-900 p-5 rounded-lg border border-slate-700 mb-6 animate-fade-in border-l-4 ${(q.type === 'tf' ? selected === (q.ans ? 0 : 1) : !wrongFill) ? 'border-l-emerald-500' : 'border-l-red-500'}`}>
                            <h4 className="font-bold text-white mb-2 flex items-center">
                                {(q.type === 'tf' ? selected === (q.ans ? 0 : 1) : !wrongFill) ? <span className="text-emerald-400"><i className="fa-solid fa-circle-check mr-2"></i> ตอบถูก (+2)</span> : <span className="text-red-400"><i className="fa-solid fa-circle-xmark mr-2"></i> {q.type === 'tf' ? 'ตอบผิด (-1)' : 'ตอบผิด (0)'}</span>}
                            </h4>
                            <p className="text-slate-300 text-sm leading-relaxed">{q.exp}</p>
                            {q.type === 'tf' && <p className="text-slate-400 text-xs mt-2">คำตอบที่ถูกต้องคือ: <strong className="text-emerald-400">{q.ans ? 'ถูก' : 'ผิด'}</strong></p>}
                            {q.type === 'fill' && <p className="text-slate-400 text-xs mt-2">คำตอบที่ยอมรับ: <strong className="text-emerald-400">{q.ans.join(' / ')}</strong></p>}
                        </div>
                    )}

                    {showExp && (
                        <button onClick={nextQ} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-lg transition-colors shadow-lg text-lg">
                            {currentQ < questions.length - 1 ? 'ข้อถัดไป ➔' : 'ดูผลคะแนน ➔'}
                        </button>
                    )}
                </div>
            );
        };

        // --- Main App Layout ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('intro');

            const menuItems = [
                { id: 'intro', icon: 'fa-desktop', label: 'Intro to OS' },
                { id: 'boot', icon: 'fa-power-off', label: 'ขั้นตอนการบูตเครื่อง' },
                { id: 'virt', icon: 'fa-box', label: 'VM & Container' },
                { id: 'structure', icon: 'fa-sitemap', label: 'OS Structure' },
                { id: 'ostypes', icon: 'fa-layer-group', label: 'ประเภทของ OS' },
                { id: 'process1', icon: 'fa-memory', label: 'Process Concept 1' },
                { id: 'process2', icon: 'fa-shuffle', label: 'Process Concept 2' },
                { id: 'processmgmt', icon: 'fa-code-branch', label: 'fork / exec / wait' },
                { id: 'thread', icon: 'fa-network-wired', label: 'Intro to Thread' },
                { id: 'scheduling', icon: 'fa-microchip', label: 'CPU Scheduling' },
                { id: 'anim', icon: 'fa-clapperboard', label: 'Process Animation', isHighlight: true },
                { id: 'strategy', icon: 'fa-crosshairs', label: 'กลยุทธ์ทำข้อสอบ', isHighlight: true },
                { id: 'realquiz', icon: 'fa-clipboard-check', label: 'ข้อสอบจำลอง (รูปแบบจริง)', isHighlight: true },
                { id: 'quiz', icon: 'fa-clipboard-question', label: 'Quiz ทบทวน (MCQ)' }
            ];

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#0f172a]">
                    {/* Sidebar */}
                    <aside className="w-full md:w-72 bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl z-20">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 drop-shadow-md tracking-tight">
                                OS Masterclass
                            </h1>
                            <p className="text-slate-400 text-xs mt-2 uppercase tracking-[0.2em] font-bold">Midterm Edition</p>
                        </div>
                        
                        <nav className="flex-1 overflow-y-auto p-4 space-y-1">
                            {menuItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)} 
                                    className={`w-full flex items-center px-4 py-3 rounded-lg transition-all duration-200 text-sm font-medium ${
                                        activeTab === item.id 
                                        ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30 shadow-inner' 
                                        : item.isHighlight 
                                            ? 'text-yellow-200/80 hover:bg-slate-800 hover:text-yellow-200 mt-4 border border-slate-800' 
                                            : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                    }`}
                                >
                                    <i className={`fa-solid ${item.icon} w-6 text-center mr-2 ${activeTab === item.id ? 'text-blue-400' : ''}`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 md:p-10 lg:p-12 overflow-y-auto bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-[#0f172a] to-slate-900">
                        {/* Render standard content blocks */}
                        {contentData[activeTab] && (
                            <div className="max-w-4xl mx-auto animate-fade-in">
                                {contentData[activeTab]}
                                
                                {/* Show Sample Code in Process Concept sections for extra completeness */}
                                {activeTab === 'process1' && (
                                    <CodeBlock 
                                        language="c" 
                                        code={`#include <stdio.h>\n#include <unistd.h>\n\nint global_var = 0; // Data Section\n\nint main() {\n    int local_var = 1; // Stack\n    int *heap_ptr = malloc(sizeof(int)); // Heap\n    return 0;\n}`} 
                                    />
                                )}
                            </div>
                        )}

                        {/* Render special components */}
                        {activeTab === 'anim' && <div className="max-w-5xl mx-auto"><ProcessAnimation /></div>}
                        {activeTab === 'realquiz' && <div className="max-w-4xl mx-auto"><RealQuiz /></div>}
                        {activeTab === 'quiz' && <div className="max-w-4xl mx-auto"><Quiz /></div>}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <React.Fragment>
                <App />
                <TermPopover />
            </React.Fragment>
        );
    </script>
</body>
</html>
